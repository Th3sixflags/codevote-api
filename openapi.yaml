openapi: 3.0.3
info:
  title: CodeVote API
  version: 1.1.0
  description: |
    API REST del sistema de votaciones estudiantiles CodeVote (UIDE).

    **Autenticación:** todos los endpoints salvo `/auth/login` y `/health`
    requieren un token JWT en la cabecera `Authorization: Bearer <token>`.
    Las operaciones de escritura (POST/PATCH/DELETE) requieren rol `admin`.
servers:
  - url: https://codevote.lat/api
    description: Producción
  - url: http://localhost:3000/api
    description: Desarrollo local
tags:
  - name: Autenticación
  - name: Facultades
  - name: Directores
  - name: Carreras
  - name: Responsables
  - name: Estudiantes
  - name: Procesos electorales
  - name: Cronogramas
  - name: Listas candidatas
  - name: Candidatos
  - name: Planes de trabajo
  - name: Requisitos
  - name: Validaciones de requisito
  - name: Códigos de voto
  - name: Actas de resultados
  - name: Veedores
  - name: Veedurías
  - name: Votaciones
  - name: Votos
  - name: Notificaciones
  - name: Portal candidato
  - name: Perfil
  - name: Asignación de candidatura
  - name: Sistema

paths:
  /auth/login:
    post:
      tags: [Autenticación]
      summary: Inicia sesión y devuelve un token JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correo_institucional, password]
              properties:
                correo_institucional:
                  type: string
                  format: email
                  example: schininin@uide.edu.ec
                password:
                  type: string
                  example: password123
      responses:
        '200':
          description: Autenticación correcta
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  usuario:
                    type: object
                    properties:
                      cedula:    { type: string }
                      nombres:   { type: string }
                      apellidos: { type: string }
                      rol:       { type: string, enum: ["estudiante", "admin", "candidato"] }
                      foto_url:  { type: string, nullable: true }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /facultades:
    get:
      tags: [Facultades]
      summary: Lista todos los registros
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Facultad' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
    post:
      tags: [Facultades]
      summary: Crea un registro (requiere rol admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FacultadInput' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Facultad' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }

  /facultades/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Facultades]
      summary: Obtiene un registro por su identificador
      responses:
        '200':
          description: Registro encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Facultad' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Facultades]
      summary: Actualiza un registro (requiere rol admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FacultadInput' }
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Facultad' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }
    delete:
      tags: [Facultades]
      summary: Elimina un registro (requiere rol admin)
      responses:
        '204': { description: Eliminado }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /directores:
    get:
      tags: [Directores]
      summary: Lista todos los registros
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Director' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
    post:
      tags: [Directores]
      summary: Crea un registro (requiere rol admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DirectorInput' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Director' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }

  /directores/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Directores]
      summary: Obtiene un registro por su identificador
      responses:
        '200':
          description: Registro encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Director' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Directores]
      summary: Actualiza un registro (requiere rol admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DirectorInput' }
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Director' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }
    delete:
      tags: [Directores]
      summary: Elimina un registro (requiere rol admin)
      responses:
        '204': { description: Eliminado }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /carreras:
    get:
      tags: [Carreras]
      summary: Lista todos los registros
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Carrera' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
    post:
      tags: [Carreras]
      summary: Crea un registro (requiere rol admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CarreraInput' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Carrera' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }

  /carreras/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Carreras]
      summary: Obtiene un registro por su identificador
      responses:
        '200':
          description: Registro encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Carrera' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Carreras]
      summary: Actualiza un registro (requiere rol admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CarreraInput' }
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Carrera' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }
    delete:
      tags: [Carreras]
      summary: Elimina un registro (requiere rol admin)
      responses:
        '204': { description: Eliminado }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /responsables:
    get:
      tags: [Responsables]
      summary: Lista todos los registros
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Responsable' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
    post:
      tags: [Responsables]
      summary: Crea un registro (requiere rol admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResponsableInput' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Responsable' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }

  /responsables/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Responsables]
      summary: Obtiene un registro por su identificador
      responses:
        '200':
          description: Registro encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Responsable' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Responsables]
      summary: Actualiza un registro (requiere rol admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResponsableInput' }
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Responsable' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }
    delete:
      tags: [Responsables]
      summary: Elimina un registro (requiere rol admin)
      responses:
        '204': { description: Eliminado }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /estudiantes:
    get:
      tags: [Estudiantes]
      summary: Lista todos los registros
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Estudiante' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
    post:
      tags: [Estudiantes]
      summary: Crea un registro (requiere rol admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EstudianteInput' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Estudiante' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }

  /estudiantes/{cedula}/asignacion-candidatura:
    parameters:
      - name: cedula
        in: path
        required: true
        schema: { type: string, minLength: 10, maxLength: 10 }
    get:
      tags: [Asignación de candidatura]
      summary: Consulta la asignación de un candidato (requiere rol admin)
      responses:
        '200':
          description: Asignación encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsignacionCandidatura' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { description: El estudiante no tiene asignación }
    post:
      tags: [Asignación de candidatura]
      summary: Asigna una papeleta a un candidato (requiere rol admin)
      description: >-
        Reglas: la cuenta debe tener rol candidato; solo puede tener una
        asignación; la papeleta debe existir y su proceso estar en periodo de
        inscripción; si la papeleta es de una carrera, el candidato debe
        pertenecer a esa misma carrera.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fk_id_votacion]
              properties:
                fk_id_votacion: { type: integer, description: Papeleta (votación) asignada. }
      responses:
        '201':
          description: Asignación creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsignacionCandidatura' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { description: El estudiante, la papeleta o su proceso no existen }
        '409':
          description: >-
            Ya tiene una asignación, la cuenta no es candidato, el proceso no
            está en inscripción, o la papeleta es de otra carrera
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }
    patch:
      tags: [Asignación de candidatura]
      summary: Cambia la papeleta asignada (requiere rol admin)
      description: >-
        No se permite si el candidato ya tiene una lista enviada a revisión,
        aprobada o con votos: primero hay que retirar o rechazar esa lista.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fk_id_votacion]
              properties:
                fk_id_votacion: { type: integer }
      responses:
        '200':
          description: Asignación actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsignacionCandidatura' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { description: El estudiante no tiene asignación }
        '409':
          description: Lista comprometida, papeleta de otra carrera o proceso fuera de inscripción
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }
    delete:
      tags: [Asignación de candidatura]
      summary: Retira la asignación (requiere rol admin)
      description: >-
        Elimina la asignación y deja libre al candidato. No se permite si ya
        tiene una lista enviada a revisión, aprobada o con votos.
      responses:
        '204': { description: Asignación retirada }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { description: El estudiante no tiene asignación }
        '409':
          description: Tiene una lista que debe conservarse
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /estudiantes/{cedula}:
    parameters:
      - name: cedula
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Estudiantes]
      summary: Obtiene un registro por su identificador
      responses:
        '200':
          description: Registro encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Estudiante' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Estudiantes]
      summary: Actualiza un registro (requiere rol admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EstudianteInput' }
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Estudiante' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }
    delete:
      tags: [Estudiantes]
      summary: Elimina un registro (requiere rol admin)
      responses:
        '204': { description: Eliminado }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /procesos-electorales:
    get:
      tags: [Procesos electorales]
      summary: Lista los procesos electorales
      description: >-
        Sin filtro devuelve todos los NO archivados. Con ?estado=actuales
        devuelve los activos o próximos (no finalizados ni cancelados). Con
        ?estado=finalizados devuelve el historial (finalizados no archivados).
        Con ?estado=archivados devuelve solo los archivados.


        Segmentación por carrera: el proceso es general y la carrera se define en
        cada votación (papeleta) que contiene. La administración ve todos los
        procesos; el estudiante ve solo aquellos que tengan al menos una papeleta
        global o de su propia carrera (un proceso sin votaciones también se
        muestra, porque aún se está preparando). Un proceso que no le
        corresponde responde 404 al pedirlo por identificador.
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum: [actuales, finalizados, archivados]
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProcesoElectoral' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
    post:
      tags: [Procesos electorales]
      summary: Crea un registro (requiere rol admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProcesoElectoralInput' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcesoElectoral' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }

  /procesos-electorales/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Procesos electorales]
      summary: Obtiene un registro por su identificador
      responses:
        '200':
          description: Registro encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcesoElectoral' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Procesos electorales]
      summary: Actualiza un registro (requiere rol admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProcesoElectoralInput' }
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcesoElectoral' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }
    delete:
      tags: [Procesos electorales]
      summary: Elimina un proceso en borrador (requiere rol admin)
      description: >-
        Solo elimina procesos SIN actividad electoral. En ese caso limpia en una
        transacción sus dependencias de preparación (validaciones, candidatos,
        planes, listas, votaciones y cronogramas). Si ya tiene votos,
        comprobantes, actas o veedurías responde 409 con el motivo: hay que
        cancelar o archivar. No se usa ON DELETE CASCADE en el esquema para que
        la evidencia electoral quede siempre protegida por las claves foráneas.
      responses:
        '204': { description: Eliminado junto con sus dependencias de borrador }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /procesos-electorales/{id}/cancelar:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Procesos electorales]
      summary: Cancela un proceso (requiere rol admin)
      description: >-
        Marca el proceso como cancelado sin borrar nada. Es la alternativa a
        eliminar cuando el proceso ya tiene actividad electoral. Un proceso
        finalizado no se cancela (se archiva), y uno ya cancelado responde 409.
      responses:
        '200':
          description: Proceso cancelado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcesoElectoral' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: El proceso ya está cancelado, o está finalizado (archívalo)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /procesos-electorales/{id}/archivar:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Procesos electorales]
      summary: Archiva un proceso (requiere rol admin)
      description: >-
        Archiva (soft) un proceso finalizado o cancelado: deja de aparecer en
        las consultas activas pero conserva votos, comprobantes, actas,
        candidatos y auditorías para el historial. No se puede archivar un
        proceso activo ni uno ya archivado.
      responses:
        '200':
          description: Proceso archivado
          content:
            application/json:
