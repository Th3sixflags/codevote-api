              schema: { $ref: '#/components/schemas/Estudiante' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }

  /estudiantes/{cedula}/asignacion-candidatura:
    parameters:
      - name: cedula
        in: path
        required: true
        schema: { type: string, minLength: 10, maxLength: 10 }
    get:
      tags: [Asignación de candidatura]
      summary: Consulta la asignación de un candidato (requiere rol admin)
      responses:
        '200':
          description: Asignación encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsignacionCandidatura' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { description: El estudiante no tiene asignación }
    post:
      tags: [Asignación de candidatura]
      summary: Asigna una papeleta a un candidato (requiere rol admin)
      description: >-
        Reglas: la cuenta debe tener rol candidato; solo puede tener una
        asignación; la papeleta debe existir y su proceso estar en periodo de
        inscripción; si la papeleta es de una carrera, el candidato debe
        pertenecer a esa misma carrera.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fk_id_votacion]
              properties:
                fk_id_votacion: { type: integer, description: Papeleta (votación) asignada. }
      responses:
        '201':
          description: Asignación creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsignacionCandidatura' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { description: El estudiante, la papeleta o su proceso no existen }
        '409':
          description: >-
            Ya tiene una asignación, la cuenta no es candidato, el proceso no
            está en inscripción, o la papeleta es de otra carrera
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }
    patch:
      tags: [Asignación de candidatura]
      summary: Cambia la papeleta asignada (requiere rol admin)
      description: >-
        No se permite si el candidato ya tiene una lista enviada a revisión,
        aprobada o con votos: primero hay que retirar o rechazar esa lista.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fk_id_votacion]
              properties:
                fk_id_votacion: { type: integer }
      responses:
        '200':
          description: Asignación actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsignacionCandidatura' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { description: El estudiante no tiene asignación }
        '409':
          description: Lista comprometida, papeleta de otra carrera o proceso fuera de inscripción
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }
    delete:
      tags: [Asignación de candidatura]
      summary: Retira la asignación (requiere rol admin)
      description: >-
        Elimina la asignación y deja libre al candidato. No se permite si ya
        tiene una lista enviada a revisión, aprobada o con votos.
      responses:
        '204': { description: Asignación retirada }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { description: El estudiante no tiene asignación }
        '409':
          description: Tiene una lista que debe conservarse
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /estudiantes/{cedula}:
    parameters:
      - name: cedula
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Estudiantes]
      summary: Obtiene un registro por su identificador
      responses:
