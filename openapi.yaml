  # ---------------------------------------------------------------------------
  # Portal del candidato: todas requieren rol 'candidato'. El backend valida
  # además que la lista/candidato/plan pertenezca al candidato autenticado,
  # que el proceso esté en inscripción y que la lista no esté aprobada.
  # ---------------------------------------------------------------------------
  /candidato/mi-asignacion:
    get:
      tags: [Asignación de candidatura]
      summary: Papeleta asignada al candidato autenticado
      description: >-
        Devuelve la papeleta asignada con su proceso, carrera y estado de
        inscripción, o null si la administración todavía no le asignó ninguna
        (sin asignación no puede inscribir lista).
      responses:
        '200':
          description: Asignación propia, o null
          content:
            application/json:
              schema:
                nullable: true
                allOf: [{ $ref: '#/components/schemas/AsignacionCandidatura' }]
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /candidato/estudiantes:
    get:
      tags: [Portal candidato]
      summary: Busca posibles integrantes para la lista
      description: >-
        Devuelve únicamente cédula, nombres, apellidos y carrera (nunca correo,
        contraseña ni promedio). Solo incluye estudiantes compatibles con la
        carrera de la papeleta asignada al candidato y excluye a quienes ya
        tienen una candidatura activa. Sin papeleta asignada responde 409.
      parameters:
        - name: buscar
          in: query
          required: true
          schema: { type: string, minLength: 2 }
          description: Texto a buscar en nombres, apellidos o cédula (mínimo 2 caracteres).
      responses:
        '200':
          description: Coincidencias (máximo 20)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    cedula:         { type: string }
                    nombres:        { type: string }
                    apellidos:      { type: string }
                    nombre_carrera: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409':
          description: El candidato no tiene papeleta asignada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { description: Falta el parámetro buscar o tiene menos de 2 caracteres }

  /candidato/listas/{listaId}/planes/archivo:
    parameters:
      - name: listaId
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Portal candidato]
      summary: Adjunta el PDF del plan de trabajo
      description: >-
        Sube el documento del plan de trabajo de la lista propia. Solo el
        candidato dueño de la lista puede subirlo, mientras la lista siga
        editable y el proceso en inscripción.


        Se admite únicamente application/pdf, con un máximo de 10 MB. El archivo
        se guarda en un volumen persistente del servidor y se publica en
        /api/uploads/planes/... La URL resultante queda en
        plan_trabajo.archivo_url.


        Si la lista tiene varios planes de trabajo hay que indicar id_plan; con
        uno solo se usa ese automáticamente.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo:
                  type: string
                  format: binary
                  description: PDF del plan de trabajo (máximo 10 MB).
                id_plan:
                  type: integer
                  description: Plan al que se adjunta; obligatorio si la lista tiene varios.
      responses:
        '201':
          description: Archivo guardado
          content:
            application/json:
              schema:
                type: object
                properties:
                  archivo_url: { type: string, example: /api/uploads/planes/8a1a82f8-....pdf }
                  plan:        { $ref: '#/components/schemas/PlanTrabajo' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: La lista no pertenece al candidato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: La lista no existe, o el id_plan indicado no es de esa lista
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >-
            La lista aún no tiene plan de trabajo, no es editable, o el proceso
            no está en inscripción
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: >-
            El archivo no es PDF, supera los 10 MB, falta el campo "archivo", o
            la lista tiene varios planes y no se indicó id_plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /candidato/mi-lista:
    get:
      tags: [Portal candidato]
      summary: Lista del candidato autenticado (con candidatos y planes)
      description: Devuelve la lista de la que el candidato es responsable, o null si aún no tiene.
      responses:
        '200':
          description: Lista propia o null
          content:
            application/json:
              schema:
                nullable: true
                allOf: [{ $ref: '#/components/schemas/ListaCandidata' }]
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /candidato/listas:
    post:
      tags: [Portal candidato]
      summary: Crea la lista del candidato en su papeleta asignada
      description: >-
        La papeleta NO se envía: se toma de la asignación que la administración
        hizo al candidato (ver GET /candidato/mi-asignacion). El proceso y la
        carrera se derivan de ella. Sin asignación responde 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre_lista]
              properties:
                nombre_lista:  { type: string, maxLength: 80 }
                lema:          { type: string, maxLength: 120 }
                foto_url:
                  type: string
                  nullable: true
                  maxLength: 255
                  description: Imagen principal de la lista; debe iniciar con https://.
      responses:
        '201':
          description: Lista creada (estado pendiente)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaCandidata' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: >-
            Sin papeleta asignada, el proceso no está en inscripción, o ya tienes
            una lista en él
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }

  /candidato/listas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Portal candidato]
      summary: Edita nombre/lema/foto de la lista propia (no aprobada)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre_lista: { type: string, maxLength: 80 }
                lema:         { type: string, maxLength: 120 }
                foto_url:
                  type: string
                  nullable: true
                  maxLength: 255
                  description: Imagen principal de la lista; https:// o vacío para quitarla.
      responses:
        '200':
          description: Lista actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaCandidata' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: Proceso fuera de inscripción o lista ya aprobada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }

  /candidato/listas/{id}/candidatos:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Portal candidato]
      summary: Agrega un candidato a la lista propia
      description: Valida que el estudiante exista, el cargo no se repita y la persona no esté en otra lista del mismo proceso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cargo, fk_cedula_estudiante]
              properties:
                cargo:                { type: string, enum: ["presidente", "vicepresidente", "secretario", "tesorero", "vocal"] }
                fk_cedula_estudiante: { type: string, minLength: 10, maxLength: 10 }
                foto_url:             { type: string, maxLength: 255 }
      responses:
        '201':
          description: Candidato agregado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Candidato' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: Cargo duplicado, persona en lista incompatible, o lista no editable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }

  /candidato/listas/{id}/planes:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Portal candidato]
      summary: Agrega un plan de trabajo a la lista propia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [area, propuesta]
              properties:
                area:        { type: string, enum: ["academico", "deportivo", "cultural", "infraestructura", "social"] }
                propuesta:   { type: string }
                archivo_url: { type: string, maxLength: 255 }
      responses:
        '201':
          description: Plan agregado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanTrabajo' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: Lista no editable o proceso fuera de inscripción
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }

  /candidato/listas/{id}/enviar-revision:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Portal candidato]
      summary: Envía la lista propia a revisión administrativa
      description: Pasa la lista a estado en_revision. Requiere al menos un candidato y proceso en inscripción.
      responses:
        '200':
          description: Lista enviada a revisión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaCandidata' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: Sin candidatos, lista aprobada/retirada o proceso fuera de inscripción
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /candidato/candidatos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Portal candidato]
      summary: Edita un candidato de la lista propia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cargo:    { type: string, enum: ["presidente", "vicepresidente", "secretario", "tesorero", "vocal"] }
                foto_url: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Candidato actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Candidato' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: Cargo duplicado o lista no editable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }
    delete:
      tags: [Portal candidato]
      summary: Quita un candidato de la lista propia
      responses:
        '204': { description: Candidato eliminado }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: Lista no editable o proceso fuera de inscripción
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /candidato/planes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Portal candidato]
      summary: Edita un plan de trabajo de la lista propia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                area:        { type: string, enum: ["academico", "deportivo", "cultural", "infraestructura", "social"] }
                propuesta:   { type: string }
                archivo_url: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Plan actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanTrabajo' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: Lista no editable o proceso fuera de inscripción
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }

  # ---------------------------------------------------------------------------
  # Perfil propio: cada usuario gestiona su cuenta (identificado por el token).
  # ---------------------------------------------------------------------------
  /perfil/foto:
    patch:
      tags: [Perfil]
      summary: Actualiza la foto de perfil del usuario autenticado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [foto_url]
              properties:
                foto_url:
                  type: string
                  maxLength: 255
                  description: URL http(s) de la imagen, o cadena vacía para quitarla.
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Estudiante' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }

  /perfil/password:
    patch:
      tags: [Perfil]
      summary: Cambia la contraseña del usuario autenticado
      description: Exige la contraseña actual correcta antes de reemplazarla.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password_actual, password_nueva]
              properties:
                password_actual: { type: string }
                password_nueva:  { type: string, minLength: 6 }
      responses:
        '200':
          description: Contraseña actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje: { type: string }
        '400':
          description: La contraseña actual es incorrecta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }

  /health:
    get:
      tags: [Sistema]
      summary: Verificación de disponibilidad del servicio
      security: []
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    NoAutenticado:
      description: Token ausente, inválido o expirado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SinPermiso:
      description: El usuario autenticado no tiene rol admin
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoEncontrado:
      description: El recurso solicitado no existe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SolicitudInvalida:
      description: Faltan campos obligatorios en la solicitud
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidacionFallida:
      description: El cuerpo de la solicitud no supera la validación
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }

    Notificacion:
      type: object
      properties:
        id_notificacion:      { type: integer }
        fk_cedula_estudiante: { type: string }
        tipo:                 { type: string, example: voto }
        titulo:               { type: string }
        mensaje:              { type: string }
        leida:                { type: integer, enum: [0, 1] }
        fecha_creacion:       { type: string, format: date-time }

    Votacion:
      type: object
      description: Incluye además puede_eliminar y motivo_bloqueo (ver EstadoEliminacion).
      properties:
        puede_eliminar:
          type: boolean
        motivo_bloqueo:
          type: string
          nullable: true
        fk_id_carrera:
          type: integer
          nullable: true
          description: Carrera de la papeleta (null si es global).
        nombre_carrera:
          type: string
          nullable: true
        id_votacion:     { type: integer }
        titulo_papeleta: { type: string }
        fecha_apertura:  { type: string, format: date-time }
        fecha_cierre:    { type: string, format: date-time }
        estado:          { type: string, example: abierta }
        id_proceso:      { type: integer }
        nombre_proceso:  { type: string }
        foto_url:
          type: string
          nullable: true
          maxLength: 255
          description: >-
            Imagen opcional de la papeleta. Debe ser una URL que inicie con
            https:// (http u otra cosa devuelve 422). Cadena vacía o null para
            quitarla.

    VotacionInput:
      type: object
      required: [fk_id_proceso, titulo_papeleta, fecha_apertura, fecha_cierre]
      properties:
        fk_id_proceso:   { type: integer }
        titulo_papeleta: { type: string, maxLength: 120 }
        fecha_apertura:  { type: string, example: "2026-07-01 08:00:00" }
        fecha_cierre:    { type: string, example: "2026-07-02 17:00:00" }
        estado:          { type: string, enum: ["pendiente", "abierta", "cerrada"] }
        fk_id_carrera:
          type: integer
          nullable: true
          description: >-
            Categoría de la papeleta. null = global (votan todos); con valor =
            solo los estudiantes de esa carrera (p. ej. "Representante TICs").
            No puede haber dos papeletas de la misma carrera en un mismo proceso
            (409).
        foto_url:
          type: string
          nullable: true
          maxLength: 255
          description: >-
            Imagen opcional de la papeleta. Debe ser una URL que inicie con
            https:// (http u otra cosa devuelve 422). Cadena vacía o null para
            quitarla.

    Voto:
      type: object
      properties:
        id_voto:         { type: integer }
        tipo_voto:       { type: string, enum: ["valido", "blanco", "nulo"] }
        fecha_hora:      { type: string, format: date-time }
        id_votacion:     { type: integer }
        titulo_papeleta: { type: string }
        id_lista:        { type: integer, nullable: true }
        nombre_lista:    { type: string, nullable: true }

    FacultadInput:
      type: object
      required: [nombre_facultad]
      properties:
        nombre_facultad:
          type: string
          maxLength: 100

    Facultad:
      type: object
      properties:
        id_facultad:
          type: integer
        nombre_facultad:
          type: string
          maxLength: 100

    DirectorInput:
      type: object
      required: [nombres, apellidos, correo]
      properties:
        nombres:
          type: string
          maxLength: 80
        apellidos:
          type: string
          maxLength: 80
        correo:
          type: string
          format: "email"
          maxLength: 120

    Director:
      type: object
      properties:
        id_director:
          type: integer
        nombres:
          type: string
          maxLength: 80
        apellidos:
          type: string
          maxLength: 80
        correo:
          type: string
          format: "email"
          maxLength: 120

    CarreraInput:
      type: object
      required: [nombre_carrera]
      properties:
        nombre_carrera:
          type: string
          maxLength: 100
        fk_id_director:
          type: integer
        fk_id_facultad:
          type: integer

    Carrera:
      type: object
      properties:
        id_carrera:
          type: integer
        nombre_carrera:
          type: string
          maxLength: 100
        fk_id_director:
          type: integer
        fk_id_facultad:
          type: integer

    ResponsableInput:
      type: object
      required: [nombres, apellidos, correo]
      properties:
        nombres:
          type: string
          maxLength: 80
        apellidos:
          type: string
          maxLength: 80
        cargo:
          type: string
          maxLength: 60
        correo:
          type: string
          format: "email"
          maxLength: 120

    Responsable:
      type: object
      properties:
        id_responsable:
          type: integer
        nombres:
          type: string
          maxLength: 80
        apellidos:
          type: string
          maxLength: 80
        cargo:
          type: string
          maxLength: 60
        correo:
          type: string
          format: "email"
          maxLength: 120

    EstudianteInput:
      type: object
      required: [cedula, nombres, apellidos, correo_institucional, password]
      properties:
        cedula:
          type: string
          minLength: 10
          maxLength: 10
          description: >-
            Cédula ecuatoriana válida: 10 dígitos, provincia 01-24 o 30, tercer
            dígito menor que 6 y dígito verificador correcto (módulo 10). Un
            número que no cumpla devuelve 422.
        nombres:
          type: string
          maxLength: 80
        apellidos:
          type: string
          maxLength: 80
        correo_institucional:
          type: string
          format: "email"
        password:
          type: string
          minLength: 6
        promedio:
          type: number
          minimum: 0
          maximum: 100
          description: Promedio sobre 100 (escala de la universidad).
        estado_academico:
          type: string
          enum: ["activo", "inactivo", "egresado", "graduado"]
        fk_id_carrera:
          type: integer
        rol:
          type: string
          enum: ["estudiante", "admin", "candidato"]

    Estudiante:
      type: object
      properties:
        cedula:
          type: string
          minLength: 10
          maxLength: 10
          description: >-
            Cédula ecuatoriana válida: 10 dígitos, provincia 01-24 o 30, tercer
            dígito menor que 6 y dígito verificador correcto (módulo 10). Un
            número que no cumpla devuelve 422.
        nombres:
          type: string
          maxLength: 80
        apellidos:
          type: string
          maxLength: 80
        correo_institucional:
          type: string
          format: "email"
        promedio:
          type: number
        estado_academico:
          type: string
          enum: ["activo", "inactivo", "egresado", "graduado"]
        fk_id_carrera:
          type: integer
        rol:
          type: string
          enum: ["estudiante", "admin", "candidato"]
        foto_url:
          type: string
          nullable: true
          maxLength: 255
          description: URL de la foto de perfil (o null).
        asignacion:
          nullable: true
          description: >-
            Asignación de candidatura cuando aplica (solo cuentas con rol
            candidato a las que el admin ya asignó una papeleta); null si no tiene.
          allOf: [{ $ref: '#/components/schemas/AsignacionCandidatura' }]

    AsignacionCandidatura:
      type: object
      description: >-
        Papeleta que la administración asignó a un candidato. El candidato no
        elige proceso, carrera ni papeleta: trabaja solo con esta asignación.
      properties:
        id_asignacion:      { type: integer }
        fk_cedula_estudiante: { type: string, minLength: 10, maxLength: 10 }
        fk_id_votacion:     { type: integer }
        titulo_papeleta:    { type: string }
        estado_votacion:    { type: string }
        carrera_votacion:   { type: integer, nullable: true }
        nombre_carrera:     { type: string, nullable: true, description: Carrera de la papeleta (null si es global). }
        id_proceso:         { type: integer }
        nombre_proceso:     { type: string }
        estado_proceso:     { type: string, description: Estado del proceso; debe ser "inscripcion" para poder asignar. }
        fecha_inicio_inscripcion: { type: string, nullable: true }
        fecha_fin_inscripcion:    { type: string, nullable: true }
        fecha_asignacion:   { type: string, format: date-time }
        estado:             { type: string, enum: ["activa", "retirada"] }
        nombres:            { type: string }
        apellidos:          { type: string }
        rol:                { type: string }

    EstadoEliminacion:
      type: object
      description: >-
        Indica si el registro puede eliminarse definitivamente. Un registro es
        borrable mientras siga siendo BORRADOR; en cuanto tiene actividad
        electoral (votos, comprobantes, actas o veedurías) deja de serlo y solo
        puede cancelarse, archivarse o retirarse. El frontend puede usar estos
        campos para decidir qué acción ofrecer antes de que el admin pulse
        Eliminar.
      properties:
        puede_eliminar:
          type: boolean
          example: false
        motivo_bloqueo:
          type: string
          nullable: true
          example: "Ya registra votos y comprobantes. Solo se puede cancelar o archivar."

    ProcesoElectoralInput:
      type: object
      required: [nombre_proceso, tipo_proceso, fecha_convocatoria, fecha_inicio_votacion, fecha_fin_votacion]
      properties:
        nombre_proceso:
          type: string
          maxLength: 120
        tipo_proceso:
          type: string
          enum: ["consejo_estudiantil", "representante_carrera", "referendum"]
        fecha_convocatoria:
          type: string
          format: "date"
        fecha_inicio_votacion:
          type: string
          example: "2026-07-01 08:00:00"
        fecha_fin_votacion:
          type: string
          example: "2026-07-02 17:00:00"
        estado:
          type: string
          enum: ["planificado", "convocado", "inscripcion", "campaña", "votacion", "escrutinio", "finalizado", "cancelado"]
        descripcion:
          type: string
          maxLength: 250
        fk_id_carrera:
          type: integer
          nullable: true
          description: >-
            SIN USO (deprecado). La carrera se define en cada votación/papeleta
            del proceso. Debe enviarse null; cualquier otro valor devuelve 422.
        fecha_inicio_inscripcion:
          type: string
          nullable: true
          example: "2026-08-05 08:00:00"
          description: Apertura del periodo de inscripción de listas.
        fecha_fin_inscripcion:
          type: string
          nullable: true
          example: "2026-08-10 17:00:00"
          description: Cierre del periodo de inscripción de listas.
        fecha_posesion:
          type: string
          nullable: true
          example: "2026-09-15 10:00:00"
          description: >-
            Posesión de los electos. Las fechas deben respetar la secuencia
            convocatoria → inscripción → votación → posesión (422 si no).
        foto_url:
          type: string
          nullable: true
          maxLength: 255
          description: >-
            Imagen opcional. Debe ser una URL que inicie con https:// (http u
            otra cosa devuelve 422). Cadena vacía o null para quitarla.

    ProcesoElectoral:
      type: object
      description: Incluye además puede_eliminar y motivo_bloqueo (ver EstadoEliminacion).
      properties:
        puede_eliminar:
          type: boolean
        motivo_bloqueo:
          type: string
          nullable: true
        id_proceso:
          type: integer
        nombre_proceso:
          type: string
          maxLength: 120
        tipo_proceso:
          type: string
          enum: ["consejo_estudiantil", "representante_carrera", "referendum"]
        fecha_convocatoria:
          type: string
          format: "date"
        fecha_inicio_votacion:
          type: string
          example: "2026-07-01 08:00:00"
        fecha_fin_votacion:
          type: string
          example: "2026-07-02 17:00:00"
        estado:
          type: string
          enum: ["planificado", "convocado", "inscripcion", "campaña", "votacion", "escrutinio", "finalizado", "cancelado"]
        descripcion:
          type: string
          maxLength: 250
        archivado_at:
          type: string
          format: date-time
          nullable: true
          description: Fecha de archivado; null si el proceso no está archivado.
        fk_id_carrera:
          type: integer
          nullable: true
          description: SIN USO (deprecado); siempre null. La carrera vive en cada votación.
        fecha_inicio_inscripcion:
          type: string
          nullable: true
          example: "2026-08-05 08:00:00"
        fecha_fin_inscripcion:
          type: string
          nullable: true
          example: "2026-08-10 17:00:00"
        fecha_posesion:
          type: string
          nullable: true
          example: "2026-09-15 10:00:00"
        foto_url:
          type: string
          nullable: true
          maxLength: 255
          description: >-
            Imagen opcional. Debe ser una URL que inicie con https:// (http u
            otra cosa devuelve 422). Cadena vacía o null para quitarla.

    CronogramaInput:
      type: object
      required: [fk_id_proceso, fk_id_responsable, actividad, fecha_inicio, fecha_fin]
      properties:
        fk_id_proceso:
          type: integer
        fk_id_responsable:
          type: integer
        actividad:
          type: string
          maxLength: 120
        fecha_inicio:
          type: string
          format: "date"
        fecha_fin:
          type: string
          format: "date"

    Cronograma:
      type: object
      properties:
        id_cronograma:
          type: integer
        fk_id_proceso:
          type: integer
        fk_id_responsable:
          type: integer
        actividad:
          type: string
          maxLength: 120
        fecha_inicio:
          type: string
          format: "date"
        fecha_fin:
          type: string
          format: "date"

    ListaCandidataInput:
      type: object
      required: [fk_id_votacion, nombre_lista, fecha_inscripcion]
      properties:
        fk_id_votacion:
          type: integer
          description: >-
            Papeleta en la que compite la lista. El proceso y la carrera se
            derivan de ella, así que NO se envían.
        nombre_lista:
          type: string
          maxLength: 80
        lema:
          type: string
          maxLength: 120
        estado_revision:
          type: string
          enum: ["pendiente", "en_revision", "aprobada", "rechazada", "retirada"]
        fecha_inscripcion:
          type: string
          format: "date"
        foto_url:
          type: string
          nullable: true
          maxLength: 255
          description: >-
            Imagen principal de la lista. Debe ser una URL que inicie con
            https:// (se rechaza http u otra cosa con 422). Cadena vacía o null
            para quitarla.

    ListaCandidata:
      type: object
      description: Incluye además puede_eliminar y motivo_bloqueo (ver EstadoEliminacion).
      properties:
        puede_eliminar:
          type: boolean
        motivo_bloqueo:
          type: string
          nullable: true
        id_lista:
          type: integer
        nombre_lista:
          type: string
          maxLength: 80
        lema:
          type: string
          maxLength: 120
        estado_revision:
          type: string
          enum: ["pendiente", "en_revision", "aprobada", "rechazada", "retirada"]
        fecha_inscripcion:
          type: string
          format: "date"
        motivo_rechazo:
          type: string
          nullable: true
          maxLength: 250
          description: Observación del administrador al rechazar (o null).
        fk_cedula_responsable:
          type: string
          nullable: true
          description: Cédula del candidato dueño de la lista (portal candidato).
        foto_url:
          type: string
          nullable: true
          maxLength: 255
          description: Imagen principal de la lista (URL https) o null.
        fk_id_votacion:
          type: integer
          nullable: true
          description: Papeleta en la que compite la lista.
        titulo_papeleta:
          type: string
          nullable: true
        carrera_votacion:
          type: integer
          nullable: true
          description: >-
            Carrera de la papeleta en la que compite la lista (no se guarda en la
            lista: se obtiene de la votación). Las listas de una papeleta de
            carrera solo se devuelven a estudiantes de esa carrera.
        nombre_carrera:
          type: string
          nullable: true
          description: Nombre de la carrera del proceso (null si es global).
        id_proceso:
          type: integer
        nombre_proceso:
          type: string
        estado_proceso:
          type: string
          description: Estado del proceso al que pertenece la lista.

    CandidatoInput:
      type: object
      required: [cargo, fk_cedula_estudiante, fk_id_lista]
      properties:
        cargo:
          type: string
          enum: ["presidente", "vicepresidente", "secretario", "tesorero", "vocal"]
        cumple_requisitos:
          type: boolean
        foto_url:
          type: string
          maxLength: 255
        fk_cedula_estudiante:
          type: string
          minLength: 10
          maxLength: 10
        fk_id_lista:
          type: integer

    Candidato:
      type: object
      properties:
        id_candidato:
          type: integer
        cargo:
          type: string
          enum: ["presidente", "vicepresidente", "secretario", "tesorero", "vocal"]
        cumple_requisitos:
          type: boolean
        foto_url:
          type: string
          maxLength: 255
        fk_cedula_estudiante:
          type: string
          minLength: 10
          maxLength: 10
        fk_id_lista:
          type: integer

    PlanTrabajoInput:
      type: object
      required: [area, propuesta, fk_id_lista]
      properties:
        area:
          type: string
          enum: ["academico", "deportivo", "cultural", "infraestructura", "social"]
        propuesta:
          type: string
        archivo_url:
          type: string
          maxLength: 255
        fk_id_lista:
          type: integer

    PlanTrabajo:
      type: object
      properties:
        id_plan:
          type: integer
        area:
          type: string
          enum: ["academico", "deportivo", "cultural", "infraestructura", "social"]
        propuesta:
          type: string
        archivo_url:
          type: string
          maxLength: 255
        fk_id_lista:
          type: integer

    RequisitoInput:
      type: object
      required: [nombre_requisito, tipo_requisito]
      properties:
        nombre_requisito:
          type: string
          maxLength: 100
        descripcion:
          type: string
          maxLength: 250
        tipo_requisito:
          type: string
          maxLength: 40

    Requisito:
      type: object
      properties:
        id_requisito:
          type: integer
        nombre_requisito:
          type: string
          maxLength: 100
        descripcion:
          type: string
          maxLength: 250
        tipo_requisito:
          type: string
          maxLength: 40

    ValidacionRequisitoInput:
      type: object
      required: [fecha_validacion, fk_id_candidato, fk_id_requisito]
      properties:
        cumple:
          type: boolean
        observacion:
          type: string
          maxLength: 250
        fecha_validacion:
          type: string
          format: "date"
        fk_id_candidato:
          type: integer
        fk_id_requisito:
          type: integer

    ValidacionRequisito:
      type: object
      properties:
        id_validacion:
          type: integer
        cumple:
          type: boolean
        observacion:
          type: string
          maxLength: 250
        fecha_validacion:
          type: string
          format: "date"
        fk_id_candidato:
          type: integer
        fk_id_requisito:
          type: integer

    CodigoVotoInput:
      type: object
      required: [fk_id_votacion, codigo_hash, fk_cedula_estudiante]
      properties:
        fk_id_votacion:
          type: integer
        codigo_hash:
          type: string
          maxLength: 255
        estado_codigo:
          type: string
          enum: ["generado", "enviado", "usado", "expirado"]
        fecha_envio:
          type: string
          example: "2026-07-01 08:00:00"
        fk_cedula_estudiante:
          type: string
          minLength: 10
          maxLength: 10

    # Escrutinio de una papeleta. Todo agregado: ni cédulas, ni nombres, ni
    # ninguna relación entre una persona y su voto.
    ResultadosVotacion:
      type: object
      properties:
        resultados:
          type: array
          description: >-
            Una fila por opción. Incluye las listas que compiten aunque tengan
            cero votos, y los blancos y nulos como filas con id_lista nulo.
          items: { $ref: '#/components/schemas/OpcionResultado' }
        resumen: { $ref: '#/components/schemas/ResumenEscrutinio' }

    OpcionResultado:
      type: object
      properties:
        id_lista:
          type: integer
          nullable: true
          description: Identificador de la lista, o nulo si la fila es el voto blanco o el nulo.
        opcion:
          type: string
          description: Nombre de la lista, o "blanco"/"nulo".
        total_votos:
          type: integer

    ResumenEscrutinio:
      type: object
      properties:
        total_habilitados:
          type: integer
          description: >-
            Padrón de la papeleta. En una papeleta de carrera cuenta solo a los
            estudiantes activos de esa carrera; en una global, a todo el padrón
            activo. No incluye a la administración ni a los candidatos de esta
            papeleta, que no pueden votarla.
        total_votantes:
          type: integer
          description: Personas que votaron, incluidas las que votaron blanco o nulo.
        faltantes:
          type: integer
          description: total_habilitados menos total_votantes, nunca negativo.
        participacion_porcentaje:
          type: number
          format: float
          description: total_votantes sobre total_habilitados, en porcentaje con dos decimales.
          example: 100
        participacion_completa:
          type: boolean
          description: >-
            Verdadero cuando ya votó todo el padrón. Es informativo: no cierra
            la votación, que sigue siendo una decisión del administrador.
        estado_resultado:
          type: string
          enum: ["provisional", "oficial"]
          description: >-
            "provisional" mientras la votación siga abierta; "oficial" cuando la
            votación está cerrada o el proceso finalizado.
        ganador:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/ListaGanadora' }]
          description: >-
            Lista más votada. Es nulo si hay empate o si todavía no hay votos.
            Los blancos y nulos nunca ganan, aunque superen a las listas.
        empate:
          type: boolean
          description: Verdadero si dos o más listas comparten el máximo de votos.
        listas_empatadas:
          type: array
          description: Listas empatadas en el máximo. Vacío si no hay empate.
          items: { $ref: '#/components/schemas/ListaGanadora' }

    ListaGanadora:
      type: object
      properties:
        id_lista:     { type: integer }
        nombre_lista: { type: string }
        total_votos:  { type: integer }
        porcentaje:
          type: number
          format: float
          description: Porcentaje sobre los votos emitidos, incluidos blancos y nulos.
          example: 63.16

    # Comprobante tal como lo devuelven TODOS los endpoints de administración
    # (listado, puntual, por votación, creación y actualización): sin cédula,
    # sin nombre, sin correo, sin lista ni candidato y sin la opción votada, ni
    # siquiera para un administrador.
    CodigoVotoAnonimo:
      type: object
      properties:
        id_codigo:
          type: integer
        titulo_papeleta:
          type: string
          description: Papeleta a la que corresponde el comprobante.
        codigo_hash:
          type: string
          maxLength: 255
          description: Hash interno de auditoría, opaco. Por sí solo no identifica a nadie.
        codigo_verificacion:
          type: string
          format: uuid
          description: Código público del comprobante (UUID v4), para cotejar el que reporte un estudiante.
        estado_codigo:
          type: string
          enum: ["generado", "enviado", "usado", "expirado"]
        fecha_envio:
          type: string
          description: Fecha de emisión del comprobante.
          example: "2026-07-01 08:00:00"

    # Comprobante tal como lo ve el estudiante en "Mis Recibos": NO incluye
    # codigo_hash (reservado a la auditoría administrativa) ni la opción votada.
    MiComprobante:
      type: object
      properties:
        id_codigo:
          type: integer
        codigo_verificacion:
          type: string
          format: uuid
          description: >-
            Identificador público y opaco del comprobante (UUID v4 aleatorio).
            No codifica cédula, correo, voto ni marca de tiempo.
        estado_codigo:
          type: string
          enum: ["generado", "enviado", "usado", "expirado"]
        fecha_envio:
          type: string
          example: "2026-07-01 08:00:00"
        fk_id_votacion:
          type: integer
        titulo_papeleta:
          type: string
        fecha_cierre:
          type: string
          format: date-time
        id_proceso:
          type: integer
        nombre_proceso:
          type: string
        fk_cedula_estudiante:
          type: string
          minLength: 10
          maxLength: 10

    ActaResultadosInput:
      type: object
      required: [fk_id_votacion]
      properties:
        fk_id_votacion:
          type: integer
        total_votantes:
          type: integer
        votos_validos:
          type: integer
        votos_blanco:
          type: integer
        votos_nulos:
          type: integer
        lista_ganadora:
          type: string
          maxLength: 80
        fecha_emision:
          type: string
          example: "2026-07-02 18:00:00"

    ActaResultados:
      type: object
      properties:
        id_acta:
          type: integer
        fk_id_votacion:
          type: integer
        total_votantes:
          type: integer
        votos_validos:
          type: integer
        votos_blanco:
          type: integer
        votos_nulos:
          type: integer
        lista_ganadora:
          type: string
          maxLength: 80
        fecha_emision:
          type: string
          example: "2026-07-02 18:00:00"

    VeedorInput:
      type: object
      required: [nombre, tipo_veedor, correo]
      properties:
        nombre:
          type: string
          maxLength: 100
        institucion:
          type: string
          maxLength: 100
        tipo_veedor:
          type: string
          enum: ["interno", "externo", "docente", "estudiante"]
        correo:
          type: string
          format: "email"
          maxLength: 120

    Veedor:
      type: object
      properties:
        id_veedor:
          type: integer
        nombre:
          type: string
          maxLength: 100
        institucion:
          type: string
          maxLength: 100
        tipo_veedor:
          type: string
          enum: ["interno", "externo", "docente", "estudiante"]
        correo:
          type: string
          format: "email"
          maxLength: 120

    VeeduriaInput:
      type: object
      required: [fk_id_votacion, fk_id_veedor, momento]
