        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CronogramaInput' }
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cronograma' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }
    delete:
      tags: [Cronogramas]
      summary: Elimina un registro (requiere rol admin)
      responses:
        '204': { description: Eliminado }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /listas-candidatas:
    get:
      tags: [Listas candidatas]
      summary: Lista todos los registros
      description: >-
        **Visibilidad.** Una candidatura solo es pública cuando la administración
        la aprueba. Los roles `estudiante` y `candidato` reciben únicamente las
        listas con `estado_revision = 'aprobada'`; las `pendiente`,
        `en_revision`, `rechazada` y `retirada` no aparecen. La única excepción
        es la lista propia: el responsable sigue viendo la suya, que es la que
        gestiona desde el Portal del candidato. El rol `admin` las ve todas.


        Se aplica el mismo criterio en los cuatro contratos de lectura: este
        listado, `/proceso/{procesoId}`, `/votacion/{votacionId}` y el detalle
        `/{id}`. Sigue vigente además el filtro por carrera de la papeleta.
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ListaCandidata' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
    post:
      tags: [Listas candidatas]
      summary: Crea un registro (requiere rol admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListaCandidataInput' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaCandidata' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }

  /listas-candidatas/proceso/{procesoId}:
    get:
      tags: [Listas candidatas]
      summary: Lista las listas candidatas de un proceso
      description: >-
        Estudiantes y candidatos reciben solo las listas aprobadas (más la
        propia); la administración, todas. Ver `/listas-candidatas`.
      parameters:
        - name: procesoId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ListaCandidata' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /listas-candidatas/votacion/{votacionId}:
    get:
      tags: [Listas candidatas]
      summary: Listas que compiten en una papeleta
      description: >-
        Devuelve las listas de esa votación. El estudiante y el candidato solo
        reciben las APROBADAS de papeletas globales o de su propia carrera (más
        la lista de la que son responsables); la administración ve todas, en
        cualquier estado de revisión.
      parameters:
        - name: votacionId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ListaCandidata' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /listas-candidatas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Listas candidatas]
      summary: Obtiene una lista con su responsable, integrantes y planes
      description: >-
        Incluye `fk_cedula_responsable`, el bloque `responsable` y el arreglo
        `integrantes` (cada uno con su `cargo` y la bandera `es_responsable`).


        Una lista que quien consulta no puede ver —de otra carrera, o que no
        está aprobada y no es la suya— se responde **404**, no 403: el acceso
        directo por ID no revela ni siquiera que existe.
      responses:
        '200':
          description: Registro encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaCandidataDetalle' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404':
          description: >-
            La lista no existe, o no es visible para quien consulta (otra
            carrera, o no aprobada y ajena).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      tags: [Listas candidatas]
      summary: Actualiza un registro (requiere rol admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListaCandidataInput' }
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaCandidata' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }
    delete:
      tags: [Listas candidatas]
      summary: Elimina una lista en borrador (requiere rol admin)
      description: >-
        Solo elimina listas SIN votos. En ese caso limpia en una transacción sus
        dependencias de preparación (validaciones de requisitos, candidatos y
        planes de trabajo). Si la lista ya recibió votos responde 409 con el
        motivo: hay que retirarla para conservarla como historial.
      responses:
        '204': { description: Eliminado }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: La lista tiene información relacionada y no puede borrarse
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /listas-candidatas/{id}/aprobar:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Listas candidatas]
      summary: Aprueba una lista (requiere rol admin)
      description: >-
        Solo procede sobre una lista en revisión: un borrador que el candidato
        nunca envió, o una lista ya resuelta o retirada, se rechazan con 409.


        Se vuelve a exigir el **programa completo** (al menos una propuesta, cada
        una con área, resumen y PDF subido a CodeVote), porque la lista sigue
        siendo editable mientras está en revisión: sin esta segunda comprobación
        bastaría con añadir después una propuesta vacía. Así una lista aprobada
        nunca contiene propuestas sin PDF. Rechazar y retirar no lo exigen:
        rechazar una lista incompleta es justamente lo que debe poder hacer la
        administración.


        Al aprobarla se avisa al responsable en sus notificaciones. Repetir la
        petición no duplica el aviso, porque la segunda llamada ya no parte de
        `en_revision`.
      responses:
        '200':
          description: Lista aprobada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaCandidata' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409':
          description: >-
            Transición de estado no válida (solo se puede aprobar o rechazar una
            lista en revisión, y solo se puede retirar una aprobada; el mensaje
            indica el estado actual y desde cuál se llega al solicitado), o
            programa incompleto: sin propuestas, o con alguna sin área, sin
            resumen o sin PDF.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /listas-candidatas/{id}/rechazar:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Listas candidatas]
      summary: Rechaza una lista con un motivo (requiere rol admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string, minLength: 1, maxLength: 250 }
      responses:
        '200':
          description: Lista rechazada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaCandidata' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: >-
            Transición de estado no válida. Solo se puede aprobar o rechazar una
            lista en revisión, y solo se puede retirar una aprobada; el mensaje
            indica el estado actual y desde cuál se llega al solicitado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }

  /listas-candidatas/{id}/retirar:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Listas candidatas]
      summary: Retira una lista (soft-delete, requiere rol admin)
      description: >-
        Marca la lista como retirada sin borrarla, conservándola para
        auditoría. Alternativa al borrado físico cuando la lista tiene
        relaciones (candidatos, planes, votos). Solo procede sobre una lista
        aprobada.
      responses:
        '200':
          description: Lista retirada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaCandidata' }
        '409':
          description: >-
            Transición de estado no válida. Solo se puede aprobar o rechazar una
            lista en revisión, y solo se puede retirar una aprobada; el mensaje
            indica el estado actual y desde cuál se llega al solicitado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /listas-candidatas/{id}/responsable:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Listas candidatas]
      summary: Transfiere la responsabilidad de la lista (requiere rol admin)
      description: >-
        Operación EXCLUSIVA de administración: el presidente no puede
        eliminarse ni cambiarse desde el Portal del candidato.


        Dentro de una única transacción: el nuevo responsable queda en
        `fk_cedula_responsable`, pasa a rol `candidato`, recibe la asignación de
        candidatura de la papeleta de la lista y se convierte en `Presidente`
        (asciende si ya era integrante, se inserta si no lo era). El responsable
        anterior hereda el cargo que deja libre el nuevo —o el primer cargo sin
        ocupar, si este no integraba la lista—, pierde su asignación y vuelve a
        rol `estudiante` si no administra otra candidatura.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cedula_nuevo_responsable]
              properties:
                cedula_nuevo_responsable:
                  type: string
                  minLength: 10
                  maxLength: 10
                  description: Cédula del estudiante que asumirá la presidencia de la lista.
              example:
                cedula_nuevo_responsable: "1100000000"
      responses:
        '200':
          description: Responsabilidad transferida (lista con su nuevo responsable e integrantes)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaCandidataDetalle' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: >-
            Ya es la responsable, cuenta de administración o estudiante inactivo,
            carrera incompatible con la papeleta, la lista no tiene papeleta, la
            persona ya participa en otra candidatura activa, o la lista tiene los
            cinco cargos ocupados y quien asume no la integraba.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }

  /candidatos:
    get:
      tags: [Candidatos]
      summary: Lista todos los registros
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Candidato' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
    post:
      tags: [Candidatos]
      summary: Crea un registro (requiere rol admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CandidatoInput' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Candidato' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }

  /candidatos/lista/{listaId}:
    get:
      tags: [Candidatos]
      summary: Lista los candidatos de una lista candidata
      parameters:
        - name: listaId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Candidato' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /candidatos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Candidatos]
      summary: Obtiene un registro por su identificador
      responses:
        '200':
          description: Registro encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Candidato' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
