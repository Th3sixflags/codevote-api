  /codigos-voto/mis-codigos:
    get:
      tags: [Códigos de voto]
      summary: Comprobantes del usuario autenticado (no requiere admin)
      description: >-
        Devuelve únicamente los comprobantes emitidos al usuario del token, con
        su `codigo_verificacion` público. Nunca incluye `codigo_hash` ni la
        opción votada.
      responses:
        '200':
          description: Listado de comprobantes propios
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MiComprobante' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /codigos-voto/mis-codigos/{id}/verificar:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        description: Identificador del comprobante propio (id_codigo).
    get:
      tags: [Códigos de voto]
      summary: Verifica un comprobante propio
      description: >-
        Confirma que la participación quedó registrada. Protegido por propiedad:
        solo el dueño del comprobante puede consultarlo; si el comprobante no
        existe o es de otro estudiante se responde 404 por igual, para no
        revelar la existencia de comprobantes ajenos. La respuesta no incluye
        cédula, correo, hash ni la opción votada.
      responses:
        '200':
          description: Comprobante verificado
          content:
            application/json:
              schema:
                type: object
                properties:
                  valido:              { type: boolean, example: true }
                  codigo_verificacion: { type: string, format: uuid }
                  proceso:             { type: string }
                  papeleta:            { type: string }
                  fecha_registro:      { type: string, format: date-time }
                  estado:              { type: string, example: registrado }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: El token no corresponde a un usuario con acceso a este recurso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: El comprobante no existe o no pertenece al usuario autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /codigos-voto:
    get:
      tags: [Códigos de voto]
      summary: Lista todos los registros (anónimo, requiere rol admin)
      description: >-
        Listado de comprobantes emitidos sin ningún dato de identidad: no
        incluye la cédula ni el nombre del estudiante, ni siquiera para un
        administrador, y tampoco la opción votada. Sirve para auditar cuántos
        comprobantes se emitieron, para qué papeleta y en qué estado están, sin
        permitir reconstruir quién participó. Para ver a qué estudiante
        pertenece un comprobante concreto están GET /codigos-voto/{id} y
        GET /codigos-voto/votacion/{votacionId}.
      responses:
        '200':
          description: Listado anónimo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CodigoVotoAnonimo' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
    post:
      tags: [Códigos de voto]
      summary: Crea un registro (requiere rol admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodigoVotoInput' }
      responses:
        '201':
          description: Creado. La respuesta es anónima, aunque la cédula viaje en la petición.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodigoVotoAnonimo' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }

  /codigos-voto/votacion/{votacionId}:
    get:
      tags: [Códigos de voto]
      summary: Lista los códigos de una votación (anónimo, requiere rol admin)
      description: >-
        Comprobantes emitidos en una votación, sin ningún dato de identidad ni
        la opción votada. Ver la lista permite auditar la participación, no
        reconstruir quién votó ni qué eligió.
      parameters:
        - name: votacionId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Listado anónimo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CodigoVotoAnonimo' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /codigos-voto/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Códigos de voto]
      summary: Obtiene un registro por su identificador (anónimo, requiere rol admin)
      description: >-
        Comprobante puntual, sin identidad ni opción votada. Para cotejar el que
        reporte un estudiante se usan codigo_hash o codigo_verificacion, que son
        identificadores opacos.
      responses:
        '200':
          description: Registro encontrado (anónimo)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodigoVotoAnonimo' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Códigos de voto]
      summary: Actualiza un registro (requiere rol admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodigoVotoInput' }
      responses:
        '200':
          description: Actualizado. La respuesta es anónima.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodigoVotoAnonimo' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }
    delete:
      tags: [Códigos de voto]
      summary: Elimina un registro (requiere rol admin)
      responses:
        '204': { description: Eliminado }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

