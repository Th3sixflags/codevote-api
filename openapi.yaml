        '200':
          description: Registro encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Veeduria' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Veedurías]
      summary: Actualiza un registro (requiere rol admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VeeduriaInput' }
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Veeduria' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }
    delete:
      tags: [Veedurías]
      summary: Elimina un registro (requiere rol admin)
      responses:
        '204': { description: Eliminado }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /votaciones:
    get:
      tags: [Votaciones]
      summary: Lista todas las votaciones (papeletas)
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Votacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
    post:
      tags: [Votaciones]
      summary: Crea una votación (requiere rol admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VotacionInput' }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Votacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }

  /votaciones/proceso/{procesoId}:
    get:
      tags: [Votaciones]
      summary: Lista las votaciones (papeletas) de un proceso electoral
      description: >-
        Cada votación es una papeleta/categoría del proceso. El estudiante recibe
        solo las papeletas globales y la de su carrera; la administración ve
        todas.
      parameters:
        - name: procesoId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Votacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /votaciones/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Votaciones]
      summary: Obtiene una votación por su identificador
      responses:
        '200':
          description: Votación encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Votacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Votaciones]
      summary: Actualiza una votación (requiere rol admin)
      description: >-
        Cambiar `estado` a `cerrada` es el CIERRE MANUAL, pensado como respaldo
        para cerrar antes de tiempo. Pasa por la misma función que el cierre
        automático, así que también emite el acta de escrutinio, avisa a la
        administración en la campanita y le manda el correo.


        Normalmente no hace falta: el backend cierra solo las papeletas cuyo
        proceso pasó de `fecha_fin_votacion`, comprobándolo cada minuto en hora
        de Ecuador (America/Guayaquil). Al arrancar hace además una
        reconciliación, por si alguna venció con el servidor apagado.


        La operación es idempotente: cerrar una papeleta ya cerrada no repite el
        acta, la notificación ni el correo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VotacionInput' }
      responses:
        '200':
          description: Actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Votacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }
    delete:
      tags: [Votaciones]
      summary: Elimina una votación (requiere rol admin)
      responses:
        '204': { description: Eliminada }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /votos:
    post:
      tags: [Votos]
      summary: Emite un voto
      description: >-
        Registra el voto de forma anónima y genera un comprobante
        (codigo_voto) para el estudiante autenticado. Cada estudiante solo
        puede votar una vez por votación. El hash del comprobante NO se
        devuelve al estudiante (el voto es secreto); queda solo para auditoría.


        Segmentación por carrera: cada papeleta puede ser global o de una carrera;
        solo los estudiantes de esa carrera pueden votarla (403 en caso
        contrario). Además la lista elegida debe competir en esa misma papeleta
        (400 si no) y estar APROBADA (409 si no). Todo se valida en el backend,
        sin depender del frontend.


        Quién vota: el padrón lo forman los estudiantes y los candidatos.
        Competir no quita el derecho al voto, así que un candidato o un
        integrante de una lista vota con normalidad, incluida la papeleta en la
        que participa. La administración queda fuera del padrón y recibe 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fk_id_votacion, tipo_voto, fk_id_lista]
              properties:
                fk_id_votacion: { type: integer, example: 1 }
                fk_id_lista:
                  type: integer
                  nullable: true
                  description: Identificador de la lista. Debe ser null si el voto es blanco o nulo.
                tipo_voto:
                  type: string
                  enum: ["valido", "blanco", "nulo"]
      responses:
        '201':
          description: Voto registrado (sin exponer el hash del comprobante).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Voto' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: >-
            La votación corresponde a otra carrera, o quien lo intenta es una
            cuenta de administración, que no forma parte del padrón.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >-
            El estudiante ya emitió su voto en esta votación, la votación no está
            abierta, el proceso no está activo, o la lista elegida no está
            aprobada (una lista pendiente, en revisión, rechazada o retirada no
            es una opción de la papeleta y tampoco se muestra en Elecciones).


            El doble voto se corta en dos capas: una comprobación previa y la
            restricción `uq_codigo_votante UNIQUE (fk_id_votacion,
            fk_cedula_estudiante)` de `codigo_voto`, que cubre la ventana entre
            ambas cuando llegan peticiones simultáneas. Ambas responden 409, de
            modo que solo puede existir un comprobante por estudiante y papeleta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }

  /votos/resultados/{votacionId}:
    get:
      tags: [Votos]
      summary: Escrutinio agregado de una votación (requiere rol admin)
      description: >-
        Conteo por opción más un resumen de participación, ganador y empate.


        **Exclusivamente administrativo.** Solo el rol `admin` puede consultarlo:
        sin token responde 401 y con rol `estudiante` o `candidato` responde 403,
        esté la papeleta abierta o cerrada y haya finalizado o no el proceso.
        Cerrar una votación ya no publica sus resultados a los estudiantes.


        El cálculo sigue siendo en tiempo real y el cierre automático de las
        papeletas vencidas no cambia: lo único que cambia es quién puede
        consultarlo.


        Todo es agregado: no se devuelven cédulas, nombres ni nada que relacione
        a una persona con su voto. El endpoint es de solo lectura — aunque el
        padrón haya votado completo, no cierra la votación.
      parameters:
        - name: votacionId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Conteo por opción y resumen del escrutinio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadosVotacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: Quien consulta no es administración (estudiante o candidato)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'Acceso denegado. Se requiere rol admin.' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /recordatorios:
    get:
      tags: [Recordatorios]
      summary: Recordatorios programados (requiere rol admin)
      description: >-
        Envíos de correo que la administración programó a mano. Los avisos
        automáticos del calendario —convocatoria al crear la papeleta, apertura,
        última llamada antes del cierre y falta por no votar— NO aparecen aquí:
        los dispara el servidor por su cuenta.
      parameters:
        - name: proceso
          in: query
          schema: { type: integer }
          description: Filtra por proceso electoral.
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RecordatorioProgramado' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
    post:
      tags: [Recordatorios]
      summary: Programa un envío de correo (requiere rol admin)
      description: >-
        El correo sale en la siguiente comprobación del servidor (cada minuto)
        a partir de `programado_para`. Sin `fk_id_votacion` va a todo el padrón
        del proceso; con él, solo al de esa papeleta.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordatorioInput' }
      responses:
        '201':
          description: Programado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordatorioProgramado' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }

  /recordatorios/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    delete:
      tags: [Recordatorios]
      summary: Cancela un recordatorio pendiente (requiere rol admin)
      description: >-
        Solo mientras no haya salido. Un recordatorio ya enviado se conserva
        como registro de lo que se comunicó y responde 409.
      responses:
        '204': { description: Cancelado }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: El recordatorio ya se envió
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /sanciones:
    get:
      tags: [Sanciones]
      summary: Faltas por no votar (requiere rol admin)
      description: >-
        Se registran solas al cerrar cada papeleta, para quienes no emitieron su
        voto.


        **Anonimato:** la ausencia se deduce de `codigo_voto`, que prueba QUIÉN
        participó pero no QUÉ votó. La tabla `voto` no interviene, así que una
        falta nunca revela ni relaciona el sentido de ningún voto.
      parameters:
        - name: proceso
          in: query
          schema: { type: integer }
        - name: votacion
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Sancion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /sanciones/mias:
    get:
      tags: [Sanciones]
      summary: Faltas propias del usuario autenticado
      description: Cada quien ve solo las suyas; el listado completo es administrativo.
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Sancion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /sanciones/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Sanciones]
      summary: Justifica o anula una falta (requiere rol admin)
      description: >-
        Una falta NUNCA se borra: ella y su resolución son historial electoral.
        Tampoco se puede reactivar, solo justificar o anular.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [estado]
              properties:
                estado:      { type: string, enum: ["justificada", "anulada"] }
                observacion: { type: string, maxLength: 250 }
      responses:
        '200':
          description: Resuelta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sancion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }

  /notificaciones:
    get:
      tags: [Notificaciones]
      summary: Notificaciones del estudiante autenticado
      description: Devuelve únicamente las notificaciones del usuario del token, de la más reciente a la más antigua.
      responses:
        '200':
          description: Listado de notificaciones propias
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notificacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /notificaciones/{id}/leida:
    patch:
      tags: [Notificaciones]
      summary: Marca una notificación propia como leída
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Notificación actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notificacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404':
          description: La notificación no existe o no pertenece al usuario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------------------------------------------------------------------------
  # Portal del candidato: todas requieren rol 'candidato'. El backend valida
  # además que la lista/candidato/plan pertenezca al candidato autenticado,
  # que el proceso esté en inscripción y que la lista no esté aprobada.
  # ---------------------------------------------------------------------------
  /candidato/mi-asignacion:
    get:
      tags: [Asignación de candidatura]
      summary: Papeleta asignada al candidato autenticado
      description: >-
        Devuelve la papeleta asignada con su proceso, carrera y estado de
        inscripción, o null si la administración todavía no le asignó ninguna
        (sin asignación no puede inscribir lista).
      responses:
        '200':
          description: Asignación propia, o null
          content:
            application/json:
              schema:
                nullable: true
                allOf: [{ $ref: '#/components/schemas/AsignacionCandidatura' }]
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /candidato/estudiantes:
    get:
      tags: [Portal candidato]
      summary: Busca posibles integrantes para la lista
      description: >-
        Devuelve únicamente cédula, nombres, apellidos y carrera (nunca correo,
        contraseña ni promedio). Solo incluye estudiantes compatibles con la
        carrera de la papeleta asignada al candidato y excluye a quienes ya
        tienen una candidatura activa. Sin papeleta asignada responde 409.
      parameters:
        - name: buscar
          in: query
          required: true
          schema: { type: string, minLength: 2 }
          description: Texto a buscar en nombres, apellidos o cédula (mínimo 2 caracteres).
      responses:
        '200':
          description: Coincidencias (máximo 20)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    cedula:         { type: string }
                    nombres:        { type: string }
                    apellidos:      { type: string }
                    nombre_carrera: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409':
          description: El candidato no tiene papeleta asignada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { description: Falta el parámetro buscar o tiene menos de 2 caracteres }

  /candidato/listas/{listaId}/planes/archivo:
    parameters:
      - name: listaId
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Portal candidato]
      summary: Adjunta el PDF del plan de trabajo
      description: >-
        Sube el documento del plan de trabajo de la lista propia. Solo el
        candidato dueño de la lista puede subirlo, mientras la lista siga
        editable y el proceso en inscripción.


        Se admite únicamente application/pdf, con un máximo de 10 MB. El archivo
        se guarda en un volumen persistente del servidor y se publica en
        /api/uploads/planes/... La URL resultante queda en
        plan_trabajo.archivo_url.


        Si la lista tiene varios planes de trabajo hay que indicar id_plan; con
        uno solo se usa ese automáticamente.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo:
                  type: string
                  format: binary
                  description: PDF del plan de trabajo (máximo 10 MB).
                id_plan:
                  type: integer
                  description: Plan al que se adjunta; obligatorio si la lista tiene varios.
      responses:
        '201':
          description: Archivo guardado
          content:
            application/json:
              schema:
                type: object
                properties:
                  archivo_url: { type: string, example: /api/uploads/planes/8a1a82f8-....pdf }
                  plan:        { $ref: '#/components/schemas/PlanTrabajo' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: La lista no pertenece al candidato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: La lista no existe, o el id_plan indicado no es de esa lista
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >-
            La lista aún no tiene plan de trabajo, no es editable, o el proceso
            no está en inscripción
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: >-
            El archivo no es PDF, supera los 10 MB, falta el campo "archivo", o
            la lista tiene varios planes y no se indicó id_plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /candidato/mi-lista:
    get:
      tags: [Portal candidato]
      summary: Lista del candidato autenticado (con responsable, integrantes y planes)
      description: >-
        Devuelve la lista de la que el candidato es responsable, o null si aún no
        tiene. Incluye el bloque `responsable`, el arreglo `integrantes` (cada uno
        con su `cargo` y la bandera `es_responsable`) y `planes`. `candidatos` se
        mantiene con el mismo contenido que `integrantes` por compatibilidad.
      responses:
        '200':
          description: Lista propia o null
          content:
            application/json:
              schema:
                nullable: true
                allOf: [{ $ref: '#/components/schemas/ListaCandidataDetalle' }]
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /candidato/listas:
    post:
      tags: [Portal candidato]
      summary: Crea la lista del candidato en su papeleta asignada
      description: >-
        La papeleta NO se envía: se toma de la asignación que la administración
        hizo al candidato (ver GET /candidato/mi-asignacion). El proceso y la
        carrera se derivan de ella. Sin asignación responde 409.


        La cédula del candidato autenticado se registra automáticamente en
        `fk_cedula_responsable` y, en la misma transacción, se le inserta como
        integrante con cargo `Presidente`. No hay que agregarlo a mano.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre_lista]
              properties:
                nombre_lista:  { type: string, maxLength: 80 }
                lema:          { type: string, maxLength: 120 }
                foto_url:
                  type: string
                  nullable: true
                  maxLength: 255
                  description: Imagen principal de la lista; debe iniciar con https://.
      responses:
        '201':
          description: Lista creada (estado pendiente)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaCandidata' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: >-
            Sin papeleta asignada, el proceso no está en inscripción, o ya tienes
            una lista en él
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }

  /candidato/listas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Portal candidato]
      summary: Edita nombre/lema/foto de la lista propia (no aprobada)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre_lista: { type: string, maxLength: 80 }
                lema:         { type: string, maxLength: 120 }
                foto_url:
                  type: string
                  nullable: true
                  maxLength: 255
                  description: Imagen principal de la lista; https:// o vacío para quitarla.
      responses:
        '200':
          description: Lista actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaCandidata' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: Proceso fuera de inscripción o lista ya aprobada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }

  /candidato/listas/{id}/candidatos:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Portal candidato]
      summary: Agrega un integrante a la lista propia
      description: >-
        Solo el responsable de la lista puede llamarlo (403 en caso contrario).
        El integrante conserva su `rol = estudiante`: NO recibe asignación de
        candidatura ni acceso a /api/candidato/*; únicamente se crea su registro
        en la tabla `candidato` con su cargo dentro de la lista.


        El cargo `Presidente` está reservado al responsable y se rechaza con 409.
        También se valida que el estudiante exista, cumpla el promedio mínimo,
        pertenezca a la carrera de la papeleta, no repita cargo y no participe ya
        en otra candidatura activa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cargo, fk_cedula_estudiante]
              properties:
                cargo:                { type: string, enum: ["Presidente", "Vicepresidente", "Secretario", "Tesorero", "Vocal"] }
                fk_cedula_estudiante: { type: string, minLength: 10, maxLength: 10 }
                foto_url:             { type: string, maxLength: 255 }
      responses:
        '201':
          description: Candidato agregado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Candidato' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: >-
            Cargo duplicado, intento de registrar un segundo Presidente, persona
            en lista incompatible o responsable de otra candidatura, o lista no
            editable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }

  /candidato/listas/{id}/planes:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Portal candidato]
      summary: Agrega un plan de trabajo (propuesta) a la lista propia
      description: >-
        La propuesta nace SIN documento. `archivo_url` no se acepta en el cuerpo:
        el respaldo tiene que ser un PDF subido a CodeVote y la única vía para
        escribirlo es `POST /candidato/listas/{listaId}/planes/archivo`. Enviar
        `archivo_url` —por ejemplo una URL https:// externa— responde **422**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [area, propuesta]
              properties:
                area:      { type: string, enum: ["academico", "deportivo", "cultural", "infraestructura", "social"] }
                propuesta: { type: string, description: Resumen de la propuesta. }
      responses:
        '201':
          description: Plan agregado (con archivo_url en null)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanTrabajo' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: Lista no editable o proceso fuera de inscripción
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }

  /candidato/listas/{id}/enviar-revision:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Portal candidato]
      summary: Envía la lista propia a revisión administrativa
      description: >-
        Pasa la lista a estado `en_revision`. Requiere proceso en inscripción, al
        menos un integrante además del presidente y el **programa completo**:


        - al menos UNA propuesta;

        - cada propuesta con su `area`, su `propuesta` (resumen) y su
          `archivo_url` apuntando a un PDF subido a CodeVote
          (`/api/uploads/planes/*.pdf`).


        Si falta algo se responde **409** con un mensaje que identifica cada
        propuesta incompleta (su id y su área) y qué le falta a cada una.


        La misma comprobación se repite al aprobar
        (`PATCH /listas-candidatas/{id}/aprobar`), porque la lista sigue siendo
        editable mientras está en revisión: así una lista aprobada nunca contiene
        propuestas sin PDF.
      responses:
        '200':
          description: Lista enviada a revisión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaCandidata' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: >-
            Sin integrantes, sin propuestas o con propuestas incompletas (sin
            área, sin resumen o sin PDF), lista aprobada/retirada, o proceso
            fuera de inscripción.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: >-
                  No se puede enviar la lista a revisión: hay una propuesta incompleta.
                  Propuesta 2 (deportivo): falta el PDF subido a CodeVote.

  /candidato/candidatos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Portal candidato]
      summary: Edita un integrante de la lista propia
      description: >-
        No permite cambiar el cargo del responsable ni asignar `Presidente` a
        otro integrante: la presidencia solo se transfiere desde la
        administración (PATCH /listas-candidatas/{id}/responsable).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cargo:    { type: string, enum: ["Presidente", "Vicepresidente", "Secretario", "Tesorero", "Vocal"] }
                foto_url: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Candidato actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Candidato' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: >-
            Cargo duplicado, intento de mover la presidencia desde el portal, o
            lista no editable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }
    delete:
      tags: [Portal candidato]
      summary: Quita un integrante de la lista propia
      description: >-
        El responsable (Presidente) NO puede eliminarse desde el portal: se
        responde 409. Para cambiarlo, la administración debe transferir la
        responsabilidad.
      responses:
        '204': { description: Integrante eliminado }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: >-
            Intento de eliminar al responsable de la lista, lista no editable o
            proceso fuera de inscripción.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /candidato/planes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Portal candidato]
      summary: Edita un plan de trabajo (propuesta) de la lista propia
      description: >-
        Solo el área y el resumen. `archivo_url` no se acepta en el cuerpo
        (**422**): el PDF se cambia volviendo a subirlo con
        `POST /candidato/listas/{listaId}/planes/archivo`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                area:      { type: string, enum: ["academico", "deportivo", "cultural", "infraestructura", "social"] }
                propuesta: { type: string, description: Resumen de la propuesta. }
      responses:
        '200':
          description: Plan actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanTrabajo' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: Lista no editable o proceso fuera de inscripción
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }

  # ---------------------------------------------------------------------------
  # Perfil propio: cada usuario gestiona su cuenta (identificado por el token).
  # ---------------------------------------------------------------------------
  /perfil/foto:
    patch:
      tags: [Perfil]
      summary: Actualiza la foto de perfil del usuario autenticado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [foto_url]
              properties:
                foto_url:
                  type: string
                  maxLength: 255
                  description: URL http(s) de la imagen, o cadena vacía para quitarla.
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Estudiante' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }

  /perfil/password:
    patch:
      tags: [Perfil]
      summary: Cambia la contraseña del usuario autenticado
      description: Exige la contraseña actual correcta antes de reemplazarla.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password_actual, password_nueva]
              properties:
                password_actual: { type: string }
                password_nueva:  { type: string, minLength: 6 }
      responses:
        '200':
          description: Contraseña actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje: { type: string }
        '400':
          description: La contraseña actual es incorrecta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }

  /health:
    get:
      tags: [Sistema]
      summary: Verificación de disponibilidad del servicio
      security: []
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    NoAutenticado:
      description: Token ausente, inválido o expirado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SinPermiso:
      description: El usuario autenticado no tiene rol admin
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoEncontrado:
      description: El recurso solicitado no existe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SolicitudInvalida:
      description: Faltan campos obligatorios en la solicitud
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidacionFallida:
      description: El cuerpo de la solicitud no supera la validación
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }

    Notificacion:
      type: object
      properties:
        id_notificacion:      { type: integer }
        fk_cedula_estudiante: { type: string }
        tipo:                 { type: string, example: voto }
        titulo:               { type: string }
        mensaje:              { type: string }
        leida:                { type: integer, enum: [0, 1] }
        fecha_creacion:       { type: string, format: date-time }

    Votacion:
      type: object
      description: >-
        Incluye además puede_eliminar y motivo_bloqueo (ver EstadoEliminacion).


        `estado` pasa a `cerrada` por sí solo cuando el proceso supera su
        `fecha_fin_votacion` (comprobación cada minuto en hora de Ecuador). Una
        papeleta cerrada deja de aceptar votos y su escrutinio pasa a oficial.
      properties:
        puede_eliminar:
          type: boolean
        motivo_bloqueo:
          type: string
          nullable: true
        fk_id_carrera:
          type: integer
          nullable: true
          description: Carrera de la papeleta (null si es global).
        nombre_carrera:
          type: string
          nullable: true
        id_votacion:     { type: integer }
        titulo_papeleta: { type: string }
        fecha_apertura:  { type: string, format: date-time }
        fecha_cierre:    { type: string, format: date-time }
        estado:          { type: string, example: abierta }
        id_proceso:      { type: integer }
        nombre_proceso:  { type: string }
        foto_url:
          type: string
          nullable: true
          maxLength: 255
          description: >-
            Imagen opcional de la papeleta. Debe ser una URL que inicie con
            https:// (http u otra cosa devuelve 422). Cadena vacía o null para
            quitarla.

    VotacionInput:
      type: object
      required: [fk_id_proceso, titulo_papeleta, fecha_apertura, fecha_cierre]
      properties:
        fk_id_proceso:   { type: integer }
        titulo_papeleta: { type: string, maxLength: 120 }
        fecha_apertura:  { type: string, example: "2026-07-01 08:00:00" }
        fecha_cierre:    { type: string, example: "2026-07-02 17:00:00" }
        estado:          { type: string, enum: ["pendiente", "abierta", "cerrada"] }
        fk_id_carrera:
          type: integer
          nullable: true
          description: >-
            Categoría de la papeleta. null = global (votan todos); con valor =
            solo los estudiantes de esa carrera (p. ej. "Representante TICs").
            No puede haber dos papeletas de la misma carrera en un mismo proceso
            (409).
        foto_url:
          type: string
          nullable: true
          maxLength: 255
          description: >-
            Imagen opcional de la papeleta. Debe ser una URL que inicie con
            https:// (http u otra cosa devuelve 422). Cadena vacía o null para
            quitarla.

    Voto:
      type: object
      properties:
        id_voto:         { type: integer }
        tipo_voto:       { type: string, enum: ["valido", "blanco", "nulo"] }
        fecha_hora:      { type: string, format: date-time }
        id_votacion:     { type: integer }
        titulo_papeleta: { type: string }
        id_lista:        { type: integer, nullable: true }
        nombre_lista:    { type: string, nullable: true }

    FacultadInput:
      type: object
      required: [nombre_facultad]
      properties:
        nombre_facultad:
          type: string
          maxLength: 100

    Facultad:
      type: object
      properties:
        id_facultad:
          type: integer
        nombre_facultad:
          type: string
          maxLength: 100

    DirectorInput:
      type: object
      required: [nombres, apellidos, correo]
      properties:
        nombres:
          type: string
          maxLength: 80
        apellidos:
          type: string
          maxLength: 80
        correo:
          type: string
          format: "email"
          maxLength: 120

    Director:
      type: object
      properties:
        id_director:
          type: integer
        nombres:
          type: string
          maxLength: 80
        apellidos:
          type: string
          maxLength: 80
        correo:
          type: string
          format: "email"
          maxLength: 120

    CarreraInput:
      type: object
      required: [nombre_carrera]
      properties:
        nombre_carrera:
          type: string
          maxLength: 100
        fk_id_director:
          type: integer
        fk_id_facultad:
          type: integer

    Carrera:
      type: object
      properties:
        id_carrera:
          type: integer
        nombre_carrera:
          type: string
          maxLength: 100
        fk_id_director:
          type: integer
        fk_id_facultad:
          type: integer

    ResponsableInput:
      type: object
      required: [nombres, apellidos, correo]
      properties:
        nombres:
          type: string
          maxLength: 80
        apellidos:
          type: string
          maxLength: 80
        cargo:
          type: string
          maxLength: 60
        correo:
          type: string
          format: "email"
          maxLength: 120

    Responsable:
      type: object
      properties:
        id_responsable:
          type: integer
        nombres:
          type: string
          maxLength: 80
        apellidos:
          type: string
          maxLength: 80
        cargo:
          type: string
          maxLength: 60
        correo:
          type: string
          format: "email"
          maxLength: 120

    EstudianteInput:
      type: object
      required: [cedula, nombres, apellidos, correo_institucional, password]
      properties:
        cedula:
          type: string
          minLength: 10
          maxLength: 10
          description: >-
            Cédula ecuatoriana válida: 10 dígitos, provincia 01-24 o 30, tercer
            dígito menor que 6 y dígito verificador correcto (módulo 10). Un
            número que no cumpla devuelve 422.
        nombres:
          type: string
          maxLength: 80
        apellidos:
          type: string
          maxLength: 80
        correo_institucional:
          type: string
          format: "email"
        password:
          type: string
          minLength: 6
        promedio:
          type: number
          minimum: 0
          maximum: 100
          description: Promedio sobre 100 (escala de la universidad).
        estado_academico:
          type: string
          enum: ["activo", "inactivo", "egresado", "graduado"]
        fk_id_carrera:
          type: integer
        rol:
          type: string
          enum: ["estudiante", "admin", "candidato"]

    Estudiante:
      type: object
      properties:
        cedula:
          type: string
          minLength: 10
          maxLength: 10
          description: >-
            Cédula ecuatoriana válida: 10 dígitos, provincia 01-24 o 30, tercer
            dígito menor que 6 y dígito verificador correcto (módulo 10). Un
            número que no cumpla devuelve 422.
        nombres:
          type: string
          maxLength: 80
        apellidos:
          type: string
          maxLength: 80
        correo_institucional:
          type: string
          format: "email"
        promedio:
          type: number
        estado_academico:
          type: string
          enum: ["activo", "inactivo", "egresado", "graduado"]
        fk_id_carrera:
          type: integer
        rol:
          type: string
          enum: ["estudiante", "admin", "candidato"]
        foto_url:
          type: string
          nullable: true
          maxLength: 255
          description: URL de la foto de perfil (o null).
        asignacion:
          nullable: true
          description: >-
            Asignación de candidatura cuando aplica (solo cuentas con rol
            candidato a las que el admin ya asignó una papeleta); null si no tiene.
          allOf: [{ $ref: '#/components/schemas/AsignacionCandidatura' }]

    AsignacionCandidatura:
      type: object
      description: >-
        Papeleta que la administración asignó a un candidato. El candidato no
        elige proceso, carrera ni papeleta: trabaja solo con esta asignación.
      properties:
        id_asignacion:      { type: integer }
        fk_cedula_estudiante: { type: string, minLength: 10, maxLength: 10 }
        fk_id_votacion:     { type: integer }
        titulo_papeleta:    { type: string }
        estado_votacion:    { type: string }
        carrera_votacion:   { type: integer, nullable: true }
        nombre_carrera:     { type: string, nullable: true, description: Carrera de la papeleta (null si es global). }
        id_proceso:         { type: integer }
        nombre_proceso:     { type: string }
        estado_proceso:     { type: string, description: Estado del proceso; debe ser "inscripcion" para poder asignar. }
        fecha_inicio_inscripcion: { type: string, nullable: true }
        fecha_fin_inscripcion:    { type: string, nullable: true }
        fecha_asignacion:   { type: string, format: date-time }
        estado:             { type: string, enum: ["activa", "retirada"] }
        nombres:            { type: string }
        apellidos:          { type: string }
        rol:                { type: string }

    EstadoEliminacion:
      type: object
      description: >-
        Indica si el registro puede eliminarse definitivamente. Un registro es
        borrable mientras siga siendo BORRADOR; en cuanto tiene actividad
        electoral (votos, comprobantes, actas o veedurías) deja de serlo y solo
        puede cancelarse, archivarse o retirarse. El frontend puede usar estos
        campos para decidir qué acción ofrecer antes de que el admin pulse
        Eliminar.
      properties:
        puede_eliminar:
          type: boolean
          example: false
        motivo_bloqueo:
          type: string
          nullable: true
          example: "Ya registra votos y comprobantes. Solo se puede cancelar o archivar."

    ProcesoElectoralInput:
      type: object
      required: [nombre_proceso, tipo_proceso, fecha_convocatoria, fecha_inicio_votacion, fecha_fin_votacion]
      properties:
        nombre_proceso:
          type: string
          maxLength: 120
        tipo_proceso:
          type: string
          enum: ["consejo_estudiantil", "representante_carrera", "referendum"]
        fecha_convocatoria:
          type: string
          format: "date"
        fecha_inicio_votacion:
          type: string
          example: "2026-07-01 08:00:00"
        fecha_fin_votacion:
          type: string
          example: "2026-07-02 17:00:00"
        estado:
          type: string
          enum: ["planificado", "convocado", "inscripcion", "campaña", "votacion", "escrutinio", "finalizado", "cancelado"]
        descripcion:
          type: string
          maxLength: 250
        fk_id_carrera:
          type: integer
          nullable: true
          description: >-
            SIN USO (deprecado). La carrera se define en cada votación/papeleta
            del proceso. Debe enviarse null; cualquier otro valor devuelve 422.
        fecha_inicio_inscripcion:
          type: string
          nullable: true
          example: "2026-08-05 08:00:00"
          description: Apertura del periodo de inscripción de listas.
        fecha_fin_inscripcion:
          type: string
          nullable: true
          example: "2026-08-10 17:00:00"
          description: Cierre del periodo de inscripción de listas.
        fecha_posesion:
          type: string
          nullable: true
          example: "2026-09-15 10:00:00"
          description: >-
            Posesión de los electos. Las fechas deben respetar la secuencia
            convocatoria → inscripción → votación → posesión (422 si no).
        foto_url:
          type: string
          nullable: true
          maxLength: 255
          description: >-
            Imagen opcional. Debe ser una URL que inicie con https:// (http u
            otra cosa devuelve 422). Cadena vacía o null para quitarla.

    ProcesoElectoral:
      type: object
      description: Incluye además puede_eliminar y motivo_bloqueo (ver EstadoEliminacion).
      properties:
        puede_eliminar:
          type: boolean
        motivo_bloqueo:
          type: string
          nullable: true
        id_proceso:
          type: integer
        nombre_proceso:
          type: string
          maxLength: 120
        tipo_proceso:
          type: string
          enum: ["consejo_estudiantil", "representante_carrera", "referendum"]
        fecha_convocatoria:
          type: string
          format: "date"
        fecha_inicio_votacion:
          type: string
          example: "2026-07-01 08:00:00"
        fecha_fin_votacion:
          type: string
          example: "2026-07-02 17:00:00"
        estado:
          type: string
          enum: ["planificado", "convocado", "inscripcion", "campaña", "votacion", "escrutinio", "finalizado", "cancelado"]
        descripcion:
          type: string
          maxLength: 250
        archivado_at:
          type: string
          format: date-time
          nullable: true
          description: Fecha de archivado; null si el proceso no está archivado.
        fk_id_carrera:
          type: integer
          nullable: true
          description: SIN USO (deprecado); siempre null. La carrera vive en cada votación.
        fecha_inicio_inscripcion:
          type: string
          nullable: true
          example: "2026-08-05 08:00:00"
        fecha_fin_inscripcion:
          type: string
          nullable: true
          example: "2026-08-10 17:00:00"
        fecha_posesion:
          type: string
          nullable: true
          example: "2026-09-15 10:00:00"
        foto_url:
          type: string
          nullable: true
          maxLength: 255
          description: >-
            Imagen opcional. Debe ser una URL que inicie con https:// (http u
            otra cosa devuelve 422). Cadena vacía o null para quitarla.

    CronogramaInput:
      type: object
      required: [fk_id_proceso, fk_id_responsable, actividad, fecha_inicio, fecha_fin]
      properties:
        fk_id_proceso:
          type: integer
        fk_id_responsable:
          type: integer
        actividad:
          type: string
          maxLength: 120
        fecha_inicio:
          type: string
          format: "date"
        fecha_fin:
          type: string
          format: "date"

    Cronograma:
      type: object
      description: >-
        Actividad del cronograma electoral de un proceso. Las fechas van en
        formato YYYY-MM-DD y `fecha_fin` no puede ser anterior a
        `fecha_inicio` (el mismo día es válido); si no se cumple, la respuesta
        es 422 señalando el campo.
      properties:
        id_cronograma:
          type: integer
        fk_id_proceso:
          type: integer
        fk_id_responsable:
          type: integer
        actividad:
          type: string
          maxLength: 120
        fecha_inicio:
          type: string
          format: "date"
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: "2026-08-01"
        fecha_fin:
          type: string
          format: "date"
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: "2026-08-10"

    ListaCandidataInput:
      type: object
      required: [fk_id_votacion, nombre_lista, fecha_inscripcion]
      properties:
        fk_id_votacion:
          type: integer
          description: >-
            Papeleta en la que compite la lista. El proceso y la carrera se
            derivan de ella, así que NO se envían.
        nombre_lista:
          type: string
          maxLength: 80
        lema:
          type: string
          maxLength: 120
        estado_revision:
          type: string
          enum: ["pendiente", "en_revision", "aprobada", "rechazada", "retirada"]
        fecha_inscripcion:
          type: string
          format: "date"
        foto_url:
          type: string
          nullable: true
          maxLength: 255
          description: >-
            Imagen principal de la lista. Debe ser una URL que inicie con
            https:// (se rechaza http u otra cosa con 422). Cadena vacía o null
            para quitarla.

    ListaCandidata:
      type: object
      description: Incluye además puede_eliminar y motivo_bloqueo (ver EstadoEliminacion).
      properties:
        puede_eliminar:
          type: boolean
        motivo_bloqueo:
          type: string
          nullable: true
        id_lista:
          type: integer
        nombre_lista:
          type: string
          maxLength: 80
        lema:
          type: string
          maxLength: 120
        estado_revision:
          type: string
          enum: ["pendiente", "en_revision", "aprobada", "rechazada", "retirada"]
        fecha_inscripcion:
          type: string
          format: "date"
        motivo_rechazo:
          type: string
          nullable: true
          maxLength: 250
          description: Observación del administrador al rechazar (o null).
        fk_cedula_responsable:
          type: string
          nullable: true
          description: Cédula del candidato dueño de la lista (portal candidato).
        foto_url:
          type: string
          nullable: true
          maxLength: 255
          description: Imagen principal de la lista (URL https) o null.
        fk_id_votacion:
          type: integer
          nullable: true
          description: Papeleta en la que compite la lista.
        titulo_papeleta:
          type: string
          nullable: true
        carrera_votacion:
          type: integer
          nullable: true
          description: >-
            Carrera de la papeleta en la que compite la lista (no se guarda en la
            lista: se obtiene de la votación). Las listas de una papeleta de
            carrera solo se devuelven a estudiantes de esa carrera.
        nombre_carrera:
          type: string
          nullable: true
          description: Nombre de la carrera del proceso (null si es global).
        id_proceso:
          type: integer
        nombre_proceso:
          type: string
        estado_proceso:
          type: string
          description: Estado del proceso al que pertenece la lista.

    CandidatoInput:
      type: object
      required: [cargo, fk_cedula_estudiante, fk_id_lista]
      properties:
        cargo:
          type: string
          enum: ["Presidente", "Vicepresidente", "Secretario", "Tesorero", "Vocal"]
        cumple_requisitos:
          type: boolean
        foto_url:
          type: string
          maxLength: 255
        fk_cedula_estudiante:
          type: string
          minLength: 10
          maxLength: 10
        fk_id_lista:
          type: integer

    Candidato:
      type: object
      description: >-
        Integrante de una lista. Estar aquí NO implica tener rol `candidato`:
        solo el responsable (cargo `Presidente`, `es_responsable: true`) tiene
        rol `candidato` y acceso al Portal del candidato; el resto conserva
        `rol = estudiante`.
      properties:
        id_candidato:
          type: integer
        cargo:
          type: string
          enum: ["Presidente", "Vicepresidente", "Secretario", "Tesorero", "Vocal"]
        cumple_requisitos:
          type: boolean
        foto_url:
          type: string
          maxLength: 255
        fk_cedula_estudiante:
          type: string
          minLength: 10
          maxLength: 10
        cedula:
          type: string
          minLength: 10
          maxLength: 10
          description: Alias de fk_cedula_estudiante.
        nombres:
          type: string
        apellidos:
          type: string
        nombre_completo:
          type: string
        es_responsable:
          type: boolean
          description: >-
            true solo para el Presidente, que es el responsable de la
            candidatura. No se puede eliminar ni cambiar desde el portal.
        fk_id_lista:
          type: integer

    ListaCandidataDetalle:
      description: >-
        Lista con su responsable, sus integrantes y sus planes de trabajo. La
        devuelven GET /candidato/mi-lista, GET /listas-candidatas/{id} y
        PATCH /listas-candidatas/{id}/responsable.
      allOf:
        - $ref: '#/components/schemas/ListaCandidata'
        - type: object
          properties:
            responsable:
              type: object
              nullable: true
              description: Datos del presidente/responsable de la lista.
              properties:
                cedula:    { type: string, minLength: 10, maxLength: 10 }
                nombres:   { type: string }
                apellidos: { type: string }
            integrantes:
              type: array
              description: Integrantes de la lista, con el Presidente primero.
              items: { $ref: '#/components/schemas/Candidato' }
            candidatos:
              type: array
              description: Mismo contenido que `integrantes` (compatibilidad).
              items: { $ref: '#/components/schemas/Candidato' }
            planes:
              type: array
              items: { $ref: '#/components/schemas/PlanTrabajo' }
          example:
            fk_cedula_responsable: "1100000000"
            responsable:
              cedula: "1100000000"
              nombres: "Nombre"
              apellidos: "Apellido"
            integrantes:
              - cedula: "1100000000"
                nombres: "Nombre"
                apellidos: "Apellido"
                cargo: "Presidente"
                es_responsable: true

    RecordatorioInput:
      type: object
      additionalProperties: false
      required: [fk_id_proceso, asunto, mensaje, programado_para]
      properties:
        fk_id_proceso:  { type: integer }
        fk_id_votacion:
          type: integer
          nullable: true
          description: Sin él, el correo va a todo el padrón del proceso.
        asunto:         { type: string, minLength: 4, maxLength: 150 }
        mensaje:        { type: string, minLength: 10, maxLength: 1000 }
        programado_para:
          type: string
          description: 'Fecha y hora en hora de Ecuador: YYYY-MM-DDTHH:mm o YYYY-MM-DD HH:mm:ss.'
          example: '2026-08-10T17:00'
        solo_pendientes:
          type: boolean
          default: true
          description: Con una papeleta indicada, envía solo a quienes aún no han votado.

    RecordatorioProgramado:
      type: object
      properties:
        id_recordatorio: { type: integer }
        fk_id_proceso:   { type: integer }
        fk_id_votacion:  { type: integer, nullable: true }
        nombre_proceso:  { type: string }
        titulo_papeleta: { type: string, nullable: true }
        asunto:          { type: string }
        mensaje:         { type: string }
        programado_para: { type: string }
        solo_pendientes: { type: boolean }
        enviado_at:      { type: string, nullable: true }
        destinatarios:   { type: integer, nullable: true }
        error:           { type: string, nullable: true }
        estado:
          type: string
          enum: ["pendiente", "enviado", "fallido"]
          description: Derivado de enviado_at y error.

    Sancion:
      type: object
      properties:
        id_sancion:           { type: integer }
        fk_cedula_estudiante: { type: string }
        nombres:              { type: string }
        apellidos:            { type: string }
        correo_institucional: { type: string, format: email }
        nombre_carrera:       { type: string, nullable: true }
        fk_id_votacion:       { type: integer }
        titulo_papeleta:      { type: string }
        id_proceso:           { type: integer }
        nombre_proceso:       { type: string }
        motivo:               { type: string }
        fecha_sancion:        { type: string }
        estado:               { type: string, enum: ["activa", "justificada", "anulada"] }
        observacion:          { type: string, nullable: true }
        correo_enviado:       { type: boolean }

    PlanTrabajoInput:
      type: object
      required: [area, propuesta, fk_id_lista]
      properties:
        area:
          type: string
          enum: ["academico", "deportivo", "cultural", "infraestructura", "social"]
        propuesta:
          type: string
          description: Resumen de la propuesta.
        archivo_url:
          type: string
          nullable: true
          maxLength: 255
          pattern: '^/api/uploads/planes/[\w.-]+\.pdf$'
          description: >-
            Solo se admite la ruta de un PDF ya subido a CodeVote, o null. Un
            enlace externo (aunque sea https) se rechaza con 422.
        fk_id_lista:
          type: integer

    PlanTrabajo:
      type: object
      description: >-
        Propuesta de una lista. Para que la lista pueda enviarse a revisión y
        aprobarse, las tres cosas son obligatorias: `area`, `propuesta` (el
        resumen) y `archivo_url` con el PDF subido a CodeVote.
      properties:
        id_plan:
          type: integer
        area:
          type: string
          enum: ["academico", "deportivo", "cultural", "infraestructura", "social"]
        propuesta:
          type: string
          description: Resumen de la propuesta.
        archivo_url:
          type: string
          nullable: true
          maxLength: 255
          pattern: '^/api/uploads/planes/[\w.-]+\.pdf$'
          description: >-
            Ruta del PDF subido a CodeVote. Solo la escribe
            POST /candidato/listas/{listaId}/planes/archivo; no se admiten
            enlaces externos. Es null mientras la propuesta no tenga documento.
          example: /api/uploads/planes/8a1a82f8-3c1e-4a0d-9f2b-7c5e1d4a6b90.pdf
        fk_id_lista:
          type: integer

    RequisitoInput:
      type: object
      required: [nombre_requisito, tipo_requisito]
      properties:
        nombre_requisito:
          type: string
          maxLength: 100
        descripcion:
          type: string
          maxLength: 250
        tipo_requisito:
          type: string
          maxLength: 40

    Requisito:
      type: object
      properties:
        id_requisito:
          type: integer
        nombre_requisito:
          type: string
          maxLength: 100
        descripcion:
          type: string
          maxLength: 250
        tipo_requisito:
          type: string
          maxLength: 40

    ValidacionRequisitoInput:
      type: object
      required: [fecha_validacion, fk_id_candidato, fk_id_requisito]
      properties:
        cumple:
          type: boolean
        observacion:
          type: string
          maxLength: 250
        fecha_validacion:
          type: string
          format: "date"
        fk_id_candidato:
          type: integer
        fk_id_requisito:
          type: integer

    ValidacionRequisito:
      type: object
      properties:
        id_validacion:
          type: integer
        cumple:
          type: boolean
        observacion:
          type: string
          maxLength: 250
        fecha_validacion:
          type: string
          format: "date"
        fk_id_candidato:
          type: integer
        fk_id_requisito:
          type: integer

    CodigoVotoInput:
      type: object
      required: [fk_id_votacion, codigo_hash, fk_cedula_estudiante]
      properties:
        fk_id_votacion:
          type: integer
        codigo_hash:
          type: string
          maxLength: 255
        estado_codigo:
          type: string
          enum: ["generado", "enviado", "usado", "expirado"]
        fecha_envio:
          type: string
          example: "2026-07-01 08:00:00"
        fk_cedula_estudiante:
          type: string
          minLength: 10
          maxLength: 10

    # Escrutinio de una papeleta. Todo agregado: ni cédulas, ni nombres, ni
    # ninguna relación entre una persona y su voto.
    ResultadosVotacion:
      type: object
      properties:
        resultados:
          type: array
          description: >-
            Una fila por opción. Incluye las listas que compiten aunque tengan
            cero votos, y los blancos y nulos como filas con id_lista nulo.
          items: { $ref: '#/components/schemas/OpcionResultado' }
        resumen: { $ref: '#/components/schemas/ResumenEscrutinio' }

    OpcionResultado:
      type: object
      properties:
        id_lista:
          type: integer
          nullable: true
          description: Identificador de la lista, o nulo si la fila es el voto blanco o el nulo.
        opcion:
          type: string
          description: Nombre de la lista, o "blanco"/"nulo".
        total_votos:
          type: integer

    ResumenEscrutinio:
      type: object
      properties:
        total_habilitados:
          type: integer
          description: >-
            Padrón de la papeleta. En una papeleta de carrera cuenta solo a los
            activos de esa carrera; en una global, a todo el padrón activo.
            Incluye a los candidatos, que votan como cualquier estudiante
            —también en su propia papeleta—, de modo que la participación puede
            llegar al 100%. No incluye a la administración, que no vota.
        total_votantes:
          type: integer
          description: Personas que votaron, incluidas las que votaron blanco o nulo.
        faltantes:
          type: integer
          description: total_habilitados menos total_votantes, nunca negativo.
        participacion_porcentaje:
          type: number
          format: float
          description: total_votantes sobre total_habilitados, en porcentaje con dos decimales.
          example: 100
        participacion_completa:
          type: boolean
          description: >-
            Verdadero cuando ya votó todo el padrón. Es informativo: no cierra
            la votación, que sigue siendo una decisión del administrador.
        estado_resultado:
          type: string
          enum: ["provisional", "oficial"]
          description: >-
            "provisional" mientras la votación siga abierta; "oficial" cuando la
            votación está cerrada o el proceso finalizado.
        ganador:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/ListaGanadora' }]
          description: >-
            Lista más votada. Es nulo si hay empate o si todavía no hay votos.
            Los blancos y nulos nunca ganan, aunque superen a las listas.
        empate:
          type: boolean
          description: Verdadero si dos o más listas comparten el máximo de votos.
        listas_empatadas:
          type: array
          description: Listas empatadas en el máximo. Vacío si no hay empate.
          items: { $ref: '#/components/schemas/ListaGanadora' }

    ListaGanadora:
      type: object
      properties:
        id_lista:     { type: integer }
        nombre_lista: { type: string }
        total_votos:  { type: integer }
        porcentaje:
          type: number
          format: float
          description: Porcentaje sobre los votos emitidos, incluidos blancos y nulos.
          example: 63.16

    # Comprobante tal como lo devuelven TODOS los endpoints de administración
    # (listado, puntual, por votación, creación y actualización): sin cédula,
    # sin nombre, sin correo, sin lista ni candidato y sin la opción votada, ni
    # siquiera para un administrador.
    CodigoVotoAnonimo:
      type: object
      properties:
        id_codigo:
          type: integer
        titulo_papeleta:
          type: string
          description: Papeleta a la que corresponde el comprobante.
        codigo_hash:
          type: string
          maxLength: 255
          description: Hash interno de auditoría, opaco. Por sí solo no identifica a nadie.
        codigo_verificacion:
          type: string
          format: uuid
          description: Código público del comprobante (UUID v4), para cotejar el que reporte un estudiante.
        estado_codigo:
          type: string
          enum: ["generado", "enviado", "usado", "expirado"]
        fecha_envio:
          type: string
          description: Fecha de emisión del comprobante.
          example: "2026-07-01 08:00:00"

    # Comprobante tal como lo ve el estudiante en "Mis Recibos": NO incluye
    # codigo_hash (reservado a la auditoría administrativa) ni la opción votada.
    MiComprobante:
      type: object
      properties:
        id_codigo:
          type: integer
        codigo_verificacion:
          type: string
          format: uuid
          description: >-
            Identificador público y opaco del comprobante (UUID v4 aleatorio).
            No codifica cédula, correo, voto ni marca de tiempo.
        estado_codigo:
          type: string
          enum: ["generado", "enviado", "usado", "expirado"]
        fecha_envio:
          type: string
          example: "2026-07-01 08:00:00"
        fk_id_votacion:
          type: integer
        titulo_papeleta:
          type: string
        fecha_cierre:
          type: string
          format: date-time
        id_proceso:
          type: integer
        nombre_proceso:
          type: string
        fk_cedula_estudiante:
          type: string
          minLength: 10
          maxLength: 10

    ActaResultadosInput:
      type: object
      required: [fk_id_votacion]
      properties:
        fk_id_votacion:
          type: integer
        total_votantes:
          type: integer
        votos_validos:
          type: integer
        votos_blanco:
          type: integer
        votos_nulos:
          type: integer
        lista_ganadora:
          type: string
          maxLength: 80
        fecha_emision:
          type: string
          example: "2026-07-02 18:00:00"

    ActaResultados:
      type: object
      properties:
        id_acta:
          type: integer
        fk_id_votacion:
          type: integer
        total_votantes:
          type: integer
        votos_validos:
          type: integer
        votos_blanco:
          type: integer
        votos_nulos:
          type: integer
        lista_ganadora:
          type: string
          maxLength: 80
        fecha_emision:
          type: string
          example: "2026-07-02 18:00:00"

    VeedorInput:
      type: object
      required: [nombre, tipo_veedor, correo]
      properties:
        nombre:
          type: string
          maxLength: 100
        institucion:
          type: string
          maxLength: 100
        tipo_veedor:
          type: string
          enum: ["interno", "externo", "docente", "estudiante"]
        correo:
          type: string
          format: "email"
          maxLength: 120

    Veedor:
      type: object
      properties:
        id_veedor:
          type: integer
        nombre:
          type: string
          maxLength: 100
        institucion:
          type: string
          maxLength: 100
        tipo_veedor:
          type: string
          enum: ["interno", "externo", "docente", "estudiante"]
        correo:
          type: string
          format: "email"
          maxLength: 120

    VeeduriaInput:
      type: object
      required: [fk_id_votacion, fk_id_veedor, momento]
      properties:
        fk_id_votacion:
          type: integer
        fk_id_veedor:
          type: integer
        momento:
          type: string
          enum: ["apertura", "desarrollo", "cierre", "escrutinio"]
        observacion:
          type: string
          maxLength: 250

    Veeduria:
      type: object
      properties:
        id_veeduria:
          type: integer
        fk_id_votacion:
          type: integer
        fk_id_veedor:
          type: integer
        momento:
          type: string
          enum: ["apertura", "desarrollo", "cierre", "escrutinio"]
        observacion:
          type: string
          maxLength: 250

security:
  - bearerAuth: []
