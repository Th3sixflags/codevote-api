        fk_id_votacion:
          type: integer
        fk_id_veedor:
          type: integer
        momento:
          type: string
          enum: ["apertura", "desarrollo", "cierre", "escrutinio"]
        observacion:
          type: string
          maxLength: 250

    Veeduria:
      type: object
      properties:
        id_veeduria:
          type: integer
        fk_id_votacion:
          type: integer
        fk_id_veedor:
          type: integer
        momento:
          type: string
          enum: ["apertura", "desarrollo", "cierre", "escrutinio"]
        observacion:
          type: string
          maxLength: 250

