        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }
    delete:
      tags: [Estudiantes]
      summary: Elimina un registro (requiere rol admin)
      responses:
        '204': { description: Eliminado }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /procesos-electorales:
    get:
      tags: [Procesos electorales]
      summary: Lista los procesos electorales
      description: >-
        Sin filtro devuelve todos los NO archivados. Con ?estado=actuales
        devuelve los activos o próximos (no finalizados ni cancelados). Con
        ?estado=finalizados devuelve el historial (finalizados no archivados).
        Con ?estado=archivados (o ?estado=archivado) devuelve SOLO los
        archivados: el historial en modo lectura, con sus papeletas, listas,
        resultados, ganador, participación y fechas. Un proceso archivado no
        aparece en ninguna otra consulta.


        Segmentación por carrera: el proceso es general y la carrera se define en
        cada votación (papeleta) que contiene. La administración ve todos los
        procesos; el estudiante ve solo aquellos que tengan al menos una papeleta
        global o de su propia carrera (un proceso sin votaciones también se
        muestra, porque aún se está preparando). Un proceso que no le
        corresponde responde 404 al pedirlo por identificador.
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum: [actuales, finalizados, archivados, actual, finalizado, archivado]
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProcesoElectoral' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
    post:
      tags: [Procesos electorales]
      summary: Crea un registro (requiere rol admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProcesoElectoralInput' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcesoElectoral' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }

  /procesos-electorales/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Procesos electorales]
      summary: Obtiene un registro por su identificador
      responses:
        '200':
          description: Registro encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcesoElectoral' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Procesos electorales]
      summary: Actualiza un registro (requiere rol admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProcesoElectoralInput' }
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcesoElectoral' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }
    delete:
      tags: [Procesos electorales]
      summary: Elimina un proceso en borrador (requiere rol admin)
      description: >-
        Solo elimina procesos SIN actividad electoral. En ese caso limpia en una
        transacción sus dependencias de preparación: validaciones, candidatos,
        planes, listas, ASIGNACIONES DE CANDIDATURA, votaciones y cronogramas.
        Además devuelve a `estudiante` a los responsables que no dirijan otra
        candidatura vigente, dejándolos libres para postularse de nuevo.


        Si ya tiene votos, comprobantes, actas o veedurías responde 409 con el
        motivo: hay que cancelar o archivar. No se usa ON DELETE CASCADE en el
        esquema para que la evidencia electoral quede siempre protegida por las
        claves foráneas.
      responses:
        '204': { description: Eliminado junto con sus dependencias de borrador }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /procesos-electorales/{id}/cancelar:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Procesos electorales]
      summary: Cancela un proceso (requiere rol admin)
      description: >-
        Marca el proceso como cancelado sin borrar nada. Es la alternativa a
        eliminar cuando el proceso ya tiene actividad electoral. Un proceso
        finalizado no se cancela (se archiva), y uno ya cancelado responde 409.
      responses:
        '200':
          description: Proceso cancelado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcesoElectoral' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: El proceso ya está cancelado, o está finalizado (archívalo)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /procesos-electorales/{id}/archivar:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Procesos electorales]
      summary: Archiva un proceso (requiere rol admin)
      description: >-
        Archiva (soft) un proceso finalizado o cancelado. NO borra nada:
        papeletas, listas, integrantes, propuestas, votos, comprobantes y actas
        se conservan como historial, consultable con ?estado=archivado.


        Lo que sí termina es la candidatura. En la misma transacción se retiran
        las asignaciones de candidatura de sus papeletas y quien presidía una de
        sus listas recupera el rol `estudiante`, salvo que siga dirigiendo otra
        candidatura vigente. Su lista deja de aparecer en GET
        /candidato/mi-lista, el proceso deja de figurar como asignación activa,
        y la persona queda libre para postularse en un proceso futuro. Las
        listas se devuelven con `archivada: true`.


        Se retiran TODAS las asignaciones de sus papeletas, sin importar el
        estado de la lista ni si tiene votos: una lista rechazada, retirada o
        con votos libera igual a su responsable, y nada de eso se borra.


        El corte es `archivado_at`, no `estado`: un proceso archivado conserva
        su estado anterior (finalizado o cancelado).


        No se puede archivar un proceso activo ni uno ya archivado (409). Los
        efectos son idempotentes: nada se repite. Al arrancar, el backend
        reconcilia los procesos que se archivaron antes de que esto existiera y
        quedaron con asignaciones activas o responsables con rol candidato.
      responses:
        '200':
          description: Proceso archivado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcesoElectoral' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: El proceso está activo o ya estaba archivado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /cronogramas:
    get:
      tags: [Cronogramas]
      summary: Lista todos los registros
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Cronograma' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
    post:
      tags: [Cronogramas]
      summary: Crea un registro (requiere rol admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CronogramaInput' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cronograma' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422': { $ref: '#/components/responses/ValidacionFallida' }

  /cronogramas/proceso/{procesoId}:
    get:
      tags: [Cronogramas]
      summary: Lista los cronogramas de un proceso electoral
      parameters:
        - name: procesoId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Cronograma' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /cronogramas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Cronogramas]
      summary: Obtiene un registro por su identificador
      responses:
        '200':
