name: Desplegar backend

# Se ejecuta en cada push a master (la rama por defecto del repo).
on:
  push:
    branches: [master]

jobs:
  # 1) Verifica que el TypeScript compile antes de desplegar nada.
  verificar:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: codevote_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ''
      DB_NAME: codevote_db
      JWT_SECRET: secreto-ci-codevote
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Preparar MySQL de pruebas
        run: |
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root codevote_db < db/schema.sql
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root codevote_db < db/migrations/2026-08-04_login_otp.sql
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root codevote_db < db/migrations/2026-08-04_recordatorios_y_sanciones.sql
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root codevote_db < db/migrations/2026-08-12_aislamiento_institucional.sql
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root codevote_db < db/migrations/2026-08-12_aislamiento_institucional.sql
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # 2) Despliega en el servidor AWS por SSH usando Docker Compose.
  desplegar:
    needs: verificar
    runs-on: ubuntu-latest
    steps:
      - name: Configurar la clave SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Desplegar en el servidor (Docker Compose)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # ServerAlive* mantiene viva la conexión durante builds lentos,
          # para que no se corte con "Broken pipe" si el servidor va justo.
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
              -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' << 'REMOTE'
            set -e
            cd /home/ubuntu/codevote-api

            # Trae el código nuevo
            git pull origin master

            # Reconstruye y reinicia SOLO el backend; MySQL no se toca.
            # "backend" es el nombre del SERVICIO en docker-compose.yml
            # (el contenedor se llama codevote-api, pero Compose usa el servicio).
            sudo docker compose up -d --build backend

            # Comprobación de salud: espera a que el backend levante.
            sleep 8
            curl --fail --silent http://127.0.0.1:3000/health > /dev/null
            echo "Backend desplegado correctamente."
          REMOTE
