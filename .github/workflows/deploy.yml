name: Desplegar backend

# La verificación se ejecuta en master, ramas de validación y PR hacia master.
# El despliegue queda estrictamente limitado a pushes sobre master.
on:
  push:
    branches:
      - master
      - 'validacion-*'
  pull_request:
    branches: [master]

jobs:
  # 1) Verifica que el TypeScript compile antes de desplegar nada.
  verificar:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: codevote_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ''
      DB_NAME: codevote_db
      JWT_SECRET: secreto-ci-codevote
      NODE_ENV: test
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Preparar MySQL de pruebas
        run: |
          set -euo pipefail
          echo 'Cargando esquema base y datos semilla en una base nueva...'
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root codevote_db < db/schema.sql
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root codevote_db < db/seed.sql

          echo 'Aplicando todas las migraciones en orden...'
          for migration in db/migrations/*.sql; do
            echo "==> ${migration}"
            if ! migration_output=$(mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root codevote_db < "${migration}" 2>&1); then
              printf '%s\n' "${migration_output}"
              # Publica el error SQL como anotación para poder diagnosticar
              # fallos de migración aun cuando GitHub no exponga los logs a
              # consultas anónimas.
              annotation=$(printf '%s' "${migration_output}" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
              echo "::error file=${migration},line=1::${annotation}"
              exit 1
            fi
            printf '%s\n' "${migration_output}"
          done

          echo 'Verificando la estructura multiinstitución...'
          mysql --protocol=TCP -N -B -h 127.0.0.1 -P 3306 -u root codevote_db <<'SQL'
          SELECT COUNT(*) FROM estudiante_institucion;
          SELECT COUNT(*) FROM estudiante_por_institucion;
          SELECT COUNT(*) FROM information_schema.COLUMNS
            WHERE TABLE_SCHEMA = DATABASE()
              AND TABLE_NAME IN ('codigo_acceso', 'sesion')
              AND COLUMN_NAME = 'fk_id_institucion';
          SELECT COUNT(*) FROM information_schema.TABLES
            WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'schema_migrations';
          SQL
      - run: npm run lint
      - run: npm run build
      - name: Registrar todas las migraciones aplicadas en el ledger
        run: |
          set -euo pipefail
          for migration in db/migrations/*.sql; do
            MIGRATIONS_OPERATOR=ci npm run migraciones:registrar -- "$(basename "${migration}")"
          done
      - run: npm test

  # 2) Despliega en el servidor AWS por SSH usando Docker Compose.
  desplegar:
    needs: verificar
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Configurar la clave SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Desplegar en el servidor (Docker Compose)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # ServerAlive* mantiene viva la conexión durante builds lentos,
          # para que no se corte con "Broken pipe" si el servidor va justo.
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
              -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' << 'REMOTE'
            set -e
            cd /home/ubuntu/codevote-api

            # Trae el código nuevo
            git pull origin master

            # Reconstruye y reinicia SOLO el backend; MySQL no se toca.
            # "backend" es el nombre del SERVICIO en docker-compose.yml
            # (el contenedor se llama codevote-api, pero Compose usa el servicio).
            sudo docker compose up -d --build backend

            # Registra el checksum del SQL que el operador ya aplicó. Este
            # comando no ejecuta DDL ni vuelve a correr la migración.
            sudo docker compose exec -T -e MIGRATIONS_OPERATOR=deploy backend \
              npm run migraciones:registrar -- 2026-08-13_control_migraciones.sql
            sudo docker compose exec -T -e MIGRATIONS_OPERATOR=deploy backend \
              npm run migraciones:registrar -- 2026-08-13_votacion_por_papeleta.sql
            sudo docker compose exec -T -e MIGRATIONS_OPERATOR=deploy backend \
              npm run migraciones:registrar -- 2026-08-14_membresias_multinstitucion.sql

            # Comprobación de salud y readiness: exige proceso, MySQL y ledger.
            sleep 8
            curl --fail --silent http://127.0.0.1:3000/health > /dev/null
            curl --fail --silent http://127.0.0.1:3000/api/health/ready > /dev/null
            echo "Backend desplegado correctamente."
          REMOTE
